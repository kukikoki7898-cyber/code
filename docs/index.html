<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://www.googleapis.com https://sheets.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 1인 1역</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#f6ecd2">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2a28; --paper:#f6ecd2; --white:#fffdf6;
  --red:#d8362b; --orange:#f39a2b; --yellow:#f7cf3d; --green:#5fae57; --blue:#4a90c9; --pink:#ef8fa8;
  --cut:14px 22px 16px 24px / 22px 14px 24px 16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(rgba(120,90,40,.13) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.hand{font-family:'Gaegu','Jua',sans-serif;font-weight:700}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* 종이 버튼 */
.btn{
  font-size:20px;padding:10px 18px;background:var(--white);border:2.5px solid var(--ink);
  border-radius:var(--cut);box-shadow:3px 4px 0 rgba(43,42,40,.22);white-space:nowrap;
}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(43,42,40,.22)}
.btn.yellow{background:var(--yellow)} .btn.red{background:var(--red);color:#fff} .btn.green{background:#bfe3b4}
.btn.small{font-size:16px;padding:6px 12px}
.btn.plain{border-color:transparent;box-shadow:none;background:none;text-decoration:underline}

/* 머리 부분 */
.top{display:flex;align-items:center;padding:14px 20px 6px}
.cal{
  width:92px;flex:none;text-align:center;background:var(--white);border:2.5px solid var(--ink);
  border-radius:8px 10px 12px 9px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(-3deg);overflow:hidden;
}
.cal .m{background:var(--red);color:#fff;font-size:17px;padding:2px 0}
.cal .d{font-size:40px;line-height:1.05}
.cal .w{font-size:15px;padding-bottom:3px}
.cal.sun .d,.cal.sun .w{color:var(--red)}
.title{margin:0 0 0 22px;font-weight:400;font-size:38px;line-height:1.15;word-break:keep-all}
.title em{font-style:normal;padding:0 6px;background:linear-gradient(transparent 52%,var(--yellow) 52%,var(--yellow) 92%,transparent 92%)}
.grow{flex:1}
.clock{margin-left:26px;font-size:36px;line-height:1;white-space:nowrap;padding:8px 14px 6px;background:var(--white);
  border:2.5px solid var(--ink);border-radius:20px 16px 22px 15px / 16px 22px 15px 20px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(1.5deg)}
.clock small{font-size:.5em;margin-right:6px}
.clock i{font-style:normal;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.prog{display:flex;align-items:center;margin-right:16px}
.prog .lab{font-size:17px;margin-right:8px}
.bar{width:210px;height:26px;border:2.5px solid var(--ink);border-radius:13px 15px 12px 14px;background:var(--white);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-right:2.5px solid var(--ink);transition:width .5s;
  background:repeating-linear-gradient(-55deg,var(--green) 0,var(--green) 7px,#7cc373 7px,#7cc373 11px)}
.bar i.zero{border-right:0}
.prog .num{font-size:26px;margin-left:10px;min-width:74px;white-space:nowrap}
.top .btn{margin-left:10px}
.net{font-size:15px;padding:3px 10px;border-radius:12px;background:var(--ink);color:#fff;margin-right:8px;display:none}
.net.show{display:inline-block}
.net.bad{background:var(--red)}

/* 이름표 */
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:8px 10px 14px;font-size:22px}
/* 아래쪽(저학년): 이름표를 화면 아래 부분에 모으고, 위에는 큰 안내를 둔다 */
.board.low{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.board.low .grid{flex:none;margin-top:auto;align-content:flex-end;padding-bottom:10px}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px;overflow:hidden}
.hero .big{font-size:clamp(28px,5.2vw,86px);line-height:1.1}
.hero .big b{font-weight:400;color:var(--red)}
.hero .sub{font-size:clamp(17px,2vw,32px);margin-top:.35em}
/* 배경 사진이 있을 때 글씨가 잘 보이도록 종이 띠를 깐다 */
body.hasimg .top{background:rgba(246,236,210,.9);box-shadow:0 2px 0 rgba(43,42,40,.12);padding-bottom:12px}
body.hasimg .hero .big,body.hasimg .hero .sub,body.hasimg .center h2,body.hasimg .center p{background:rgba(255,253,246,.88);padding:.08em .5em;border-radius:14px}
body.hasimg .hero .arrow{text-shadow:0 0 6px #fff,0 0 12px #fff}
.swatches{display:flex;flex-wrap:wrap;margin-bottom:8px}
.where{display:flex;align-items:flex-start;padding:8px 10px;margin-top:6px;border:2px solid #d8cfb6;border-radius:10px;cursor:pointer;font-size:18px;line-height:1.3}
.where input{width:22px;height:22px;margin:2px 10px 0 0;flex:none}
.where.on{border-color:var(--ink);background:#fff6cf}
.where small{font-size:16px}
.gload{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#eaf2fb;border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:17px}
.gload .btn{margin-top:4px}
.privacy-note{font:14px/1.5 sans-serif;margin:8px 0 0;color:#44546a}
.privacy-note a{color:#2b5c9a}
/* 수업 시간 잠금 */
.lockov{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;
  background:rgba(246,236,210,.72)}
.lockbox{pointer-events:auto;text-align:center;background:var(--white);border:3px solid var(--ink);border-radius:var(--cut);padding:20px 30px;
  box-shadow:6px 8px 0 rgba(43,42,40,.25);transform:rotate(-1.5deg);max-width:90%}
.lockbox .lk1{font-size:clamp(26px,3.6vw,54px)}
.lockbox .lk2{font-size:clamp(17px,1.8vw,28px);margin:6px 0 14px}
/* 학급 목표 */
.goal{margin-left:14px;font-size:22px;white-space:nowrap;padding:6px 12px 4px;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:16px 12px 18px 12px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(-1.5deg)}
.goal b{font-weight:400;color:var(--red)}
.goal .gtx{font-size:.75em;margin-left:4px}
.goal.done{background:#ffd0dc;animation:pop .5s}
/* 백업 알림 점 */
.btn.due{position:relative}
.btn.due:after{content:'';position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.warnbox{background:#fdeeee;border:2px solid #e7a6a1;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:18px}
.warnbox .btn{margin-top:8px}
.row .pn{width:64px;font-size:18px}.row .w-time{width:190px}
.card{-webkit-touch-callout:none}
.sw{width:86px;height:64px;margin:0 10px 10px 0;border:2.5px solid var(--ink);border-radius:12px;cursor:pointer;position:relative;
  font-size:15px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;box-shadow:2px 3px 0 rgba(43,42,40,.18)}
.sw span{background:rgba(255,253,246,.9);border-radius:6px;padding:0 5px}
.sw.on{outline:4px solid var(--red);outline-offset:2px}
.sw.img{background-size:cover;background-position:center}
.hero .arrow{font-size:clamp(22px,3vw,48px);margin-top:.2em;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.25em)}}
@media (max-height:560px){.hero .sub,.hero .arrow{display:none}}
.hero.tight .sub,.hero.tight .arrow{display:none}
.card{
  position:relative;width:12em;height:9.2em;margin:.45em;padding:.6em .7em;
  border:.12em solid var(--ink);border-radius:var(--cut);box-shadow:.2em .26em 0 rgba(43,42,40,.2);cursor:pointer;
}
.card:before{
  content:'';position:absolute;top:-.55em;left:50%;width:3.4em;height:1.05em;margin-left:-1.7em;
  background:rgba(255,246,190,.82);border-left:1px dashed rgba(43,42,40,.25);border-right:1px dashed rgba(43,42,40,.25);
  transform:rotate(-2deg);
}
.c0{background:#ffd6cb}.c1{background:#ffe4b8}.c2{background:#fff0a3}.c3{background:#d3edc4}.c4{background:#cbe4f6}.c5{background:#f9cfde}
.card:active{transform:scale(.97) !important}
.no{
  position:absolute;top:.5em;left:.55em;width:1.75em;height:1.75em;line-height:1.7em;text-align:center;font-size:.95em;
  background:var(--white);border:.12em solid var(--ink);border-radius:50%;
}
.name{margin-left:1.25em;font-size:1.9em;line-height:1.12;white-space:nowrap;overflow:hidden}
.name.long{font-size:1.45em;line-height:1.46}
.role{margin-top:.15em;font-size:1.28em;line-height:1.2;color:#3a3835;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role.m{font-size:1.08em}.role.s{font-size:.94em}
.role i{font-size:.9em}
.role i{font-style:normal;margin-right:.2em}
.slots{position:absolute;left:0;right:0;bottom:.5em;display:flex;justify-content:center;align-items:center}
.slot{
  position:relative;width:3.7em;height:3.7em;margin:0 .12em;border:.12em dashed rgba(43,42,40,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.slot b{font-weight:400;font-size:1.1em;color:rgba(43,42,40,.3)}
.t2 .slot{width:3.6em;height:3.6em}.t3 .slot{width:3.2em;height:3.2em}
.t4 .slot{width:2.5em;height:2.5em}.t5 .slot{width:2em;height:2em}
.t4 .slot b,.t5 .slot b{font-size:.8em}
.slot.on{border-color:transparent}
.stamp{position:absolute;left:-6%;top:-6%;width:112%;height:112%;color:var(--red);opacity:.9}
.stamp.new{animation:ink .28s .2s backwards}
@keyframes ink{0%{transform:scale(1.3);opacity:0}100%{opacity:.9}}
.presser{position:fixed;z-index:55;pointer-events:none;transform-origin:50% 100%;animation:press .62s forwards}
.presser svg{display:block;width:100%;height:100%}
@keyframes press{
  0%{transform:translateY(-80%) rotate(-16deg);opacity:0;animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  14%{opacity:1}
  32%{transform:translateY(0) rotate(0) scaleY(1)}
  41%{transform:translateY(0) rotate(0) scaleY(.88)}
  54%{transform:translateY(0) rotate(0) scaleY(1);opacity:1}
  100%{transform:translateY(-75%) rotate(10deg);opacity:0}
}
.card.hit{animation:hit .3s}
@keyframes hit{35%{margin-top:.8em;margin-bottom:.1em}70%{margin-top:.3em;margin-bottom:.6em}}
.undo{
  position:absolute;right:.4em;top:.4em;font-size:.72em;padding:.2em .55em;background:var(--white);
  border:.14em solid var(--ink);border-radius:1em;display:none;
}
.card.some .undo{display:block}
.streak{position:absolute;left:-.5em;top:-.75em;font-size:.72em;padding:.1em .45em;background:var(--yellow);
  border:.14em solid var(--ink);border-radius:.4em;transform:rotate(-5deg);z-index:2}
.card.absent{background:#e6e0d0;border-style:dashed;box-shadow:none;opacity:.75}
.card.absent .slots{font-size:1.5em;color:rgba(43,42,40,.55)}
.card.shake{animation:shake .35s}
@keyframes shake{25%{margin-left:.2em}50%{margin-left:.7em}75%{margin-left:.3em}}

/* 가운데 안내 */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}
.center h2{font-weight:400;font-size:54px;margin:0 0 8px}
.center p{font-size:28px;margin:6px 0 22px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;max-width:900px;margin-bottom:18px}
.tags .btn{font-size:30px;padding:16px 30px;margin:10px}
.banner{
  position:fixed;left:50%;top:38%;z-index:60;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;
  font-size:64px;padding:18px 44px;background:var(--yellow);border:5px solid var(--ink);border-radius:var(--cut);
  box-shadow:8px 10px 0 rgba(43,42,40,.25);white-space:nowrap;animation:pop .5s cubic-bezier(.2,1.6,.5,1);
}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;font-size:20px;padding:10px 22px;
  background:var(--ink);color:#fff;border-radius:12px;max-width:90%}

/* 스티커판 */
.wrap{max-width:1100px;margin:0 auto;padding:6px 20px 30px}
table.st{width:100%;border-collapse:collapse;background:var(--white);border:2.5px solid var(--ink);font-size:22px}
table.st th{font-weight:400;background:#cbe4f6;border-bottom:2.5px solid var(--ink);padding:8px 4px}
table.st th.rest{color:var(--red)}
table.st th,table.st td{white-space:nowrap}
table.st td{padding:5px 4px;text-align:center;border-bottom:1.5px dashed rgba(43,42,40,.3)}
table.st td.nm{text-align:left;padding-left:14px;white-space:nowrap}
table.st td.nm small{font-family:'Gaegu',sans-serif;font-size:.8em;margin-left:8px;opacity:.75}
.dot{display:inline-block;width:38px;height:38px;line-height:34px;border-radius:50%;font-size:22px;border:2px dashed rgba(43,42,40,.25);color:rgba(43,42,40,.45)}
.dot.full{border:2.5px solid var(--ink);color:#fff;transform:rotate(-8deg)}
.dot.part{border:2.5px solid var(--ink);background:var(--white);color:var(--ink)}
.dot.future,.dot.rest{border-color:transparent}
.dot.absent{border-color:transparent;font-size:15px}
.legend{font-size:17px;margin:10px 2px}
.legend .dot{width:26px;height:26px;line-height:22px;font-size:15px;vertical-align:middle;margin:0 4px 0 14px}

/* 설정 */
.tabs{display:flex;flex-wrap:wrap;margin:0 0 14px}
.tabs .btn{margin:0 8px 8px 0}
.tabs .btn.on{background:var(--ink);color:#fff}
.sheet{background:var(--white);border:2.5px solid var(--ink);border-radius:var(--cut);padding:18px;box-shadow:4px 5px 0 rgba(43,42,40,.18)}
.sheet h3{font-weight:400;font-size:24px;margin:0 0 4px}
.sheet h3:not(:first-child){margin-top:20px}
.sheet p.note{font-family:'Gaegu',sans-serif;font-size:19px;margin:2px 0 12px;line-height:1.35}
.in{font-size:20px;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff;min-width:0;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;margin-bottom:8px}
.row>*{margin-right:8px}
.row .w-no{width:66px;text-align:center}.row .w-name{width:150px}.row .w-role{flex:1}.row .w-date{width:190px}
.row .ico{width:52px;height:46px;font-size:24px;padding:0;background:#fff;border:2px solid var(--ink);border-radius:8px}
.row .cnt{width:74px}
.rowhead{font-size:16px;opacity:.7}
.field{margin-bottom:16px}
.field label{display:block;font-size:18px;margin-bottom:4px}
.field .in{width:100%}
.field .line{display:flex}.field .line .in{flex:1;margin-right:8px}
.chips{display:flex;flex-wrap:wrap}
.chips .btn{margin:0 8px 8px 0}
.chips .btn.on{background:#e6e0d0;border-style:dashed;text-decoration:line-through}
.url{font-family:monospace;font-size:15px;word-break:break-all;background:#f3eedd;padding:8px;border-radius:6px;-webkit-user-select:all;user-select:all}

/* 모달 */
.shade{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(43,42,40,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border:3px solid var(--ink);border-radius:var(--cut);padding:22px;width:460px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:6px 8px 0 rgba(43,42,40,.3)}
.modal h3{font-weight:400;font-size:26px;margin:0 0 12px}
.modal .btns{display:flex;justify-content:flex-end;margin-top:14px}
.modal .btns .btn{margin-left:8px}
.emo{display:flex;flex-wrap:wrap}
.emo button{width:54px;height:54px;font-size:28px;border:0;background:none}

/* 아주 큰 화면(4K를 그대로 쓰는 전자칠판): 이름표는 이미 커지므로, 머리 부분·창·설정 화면도 함께 키워 손가락으로 누르기 쉽게 */
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .clock i,.hero .arrow{animation:none !important}
}
@media (min-width:2400px) and (min-height:1300px){
  .top,.wrap,.shade .modal,.toast,.banner,.lockbox,.center,#or-login>div{zoom:1.6}
}
@media (max-width:1100px){
  .title{font-size:30px;margin-left:16px}.clock{font-size:28px;margin-left:16px}
  .prog .lab{display:none}.bar{width:130px}.prog .num{font-size:22px;min-width:62px}
}
@media (max-width:900px){
  .top{flex-wrap:wrap;padding:10px 12px 2px}
  .cal{width:70px}.cal .m{font-size:14px}.cal .d{font-size:30px}.cal .w{font-size:12px}
  .title{font-size:25px;margin-left:14px}
  .clock{font-size:23px;margin-left:12px;padding:6px 10px 4px}
  .prog{order:9;width:100%;margin:12px 0 0}.prog .lab{display:inline}.bar{flex:1;width:auto}
  .btn{font-size:17px;padding:8px 12px}.btn.small{font-size:15px;padding:6px 10px}
  .center h2{font-size:34px}.center p{font-size:21px}
  .tags .btn{font-size:22px;padding:12px 20px;margin:7px}
  .banner{font-size:34px;padding:12px 24px}
  .wrap{padding:6px 10px 24px;overflow-x:auto}
  table.st{font-size:17px}table.st td.nm small{display:none}
  .dot{width:28px;height:28px;line-height:24px;font-size:16px}.dot.absent{font-size:11px}
  .row{flex-wrap:wrap}.row .w-role{flex:1 1 100%;order:5;margin-top:6px}.rowhead{display:none}
  .row .w-date{width:150px}
  .sheet{padding:14px}.field .line{flex-wrap:wrap}.field .line .in{flex:1 1 100%;margin:0 0 8px}
}
@media (max-width:900px){.goal .gtx{display:none}.goal{font-size:18px;margin-left:10px}}
@media (max-width:520px){
  .cal{width:56px;border-width:2px}.cal .m{font-size:12px}.cal .d{font-size:24px}.cal .w{font-size:11px}
  .title{font-size:20px;margin-left:10px;flex:1 1 calc(100% - 80px);min-width:0}
  .fslab{display:none}
  .clock{margin-top:10px !important;margin-right:8px !important}
  .goal{font-size:15px;padding:4px 8px 2px;margin:10px 6px 0 0}
  .top .btn{font-size:15px;padding:5px 9px;margin-right:6px}
  .clock{font-size:17px !important;padding:5px 8px 3px !important}
  .title em{display:inline-block}
  .grow{display:none}
  .clock{font-size:19px;margin:0}
  .top .btn{margin:10px 8px 0 0}
  .prog{margin-top:10px}
  .banner{font-size:25px;white-space:normal;width:86%;text-align:center}
  .center h2{font-size:28px}.center p{font-size:19px}
  table.st{font-size:15px}table.st td.nm{padding-left:8px}
  .row .w-name{flex:1;width:auto}
  .emo button{width:46px;height:46px;font-size:24px}
}
</style>
</head>

<script>
/**
 * 우리 반 1인 1역 — Google Apps Script 서버 코드
 *
 * 시트 구성 (학급마다 스프레드시트 1개)
 *   요약   : 맨 앞 시트. 학급 전체 현황과 학생별 통계 (자동으로 다시 쓰임)
 *   명단   : 번호 | 이름 | 역할 | 그림 | 하루 횟수
 *   기록   : 번호 | 이름 | 역할 | 2026-03-02 | 2026-03-03 | ...   (칸 값: ○, ○○, 결석)
 *   쉬는날 : 시작 | 끝 | 이름
 *
 * 학급 목록(이름, 시트 ID, 비밀번호 해시)은 스크립트 속성에 저장한다.
 */

var TZ = 'Asia/Seoul';
var SH_ROSTER = '명단';
var SH_LOG = '기록';
var SH_REST = '쉬는날';
var SH_SUM = '요약';
var SUM_HEAD = ['번호', '이름', '역할', '하루 횟수', '오늘', '월', '화', '수', '목', '금', '이번 주', '이번 달', '전체 달성률', '연속', '모은 스티커'];
var SUM_COLS = 15;
var SUM_TOP = 7;
var WEEK_KO = ['일', '월', '화', '수', '목', '금', '토'];
var C_HEAD = '#3d6fa5';
var C_SOFT = '#eaf2fb';
var C_LINE = '#c9d3de';
var ROSTER_HEAD = ['번호', '이름', '역할', '그림', '하루 횟수'];
var LOG_HEAD = ['번호', '이름', '역할'];
var REST_HEAD = ['시작', '끝', '이름'];
var MARK = '○';
var ABSENT = '결석';
var MAX_TARGET = 5;
// 참이면 꾸미기 오류도 숨기지 않고 알려 준다. (설치 점검과 자동 검사에서만 켠다)
var STRICT_ = typeof __STRICT_STYLE !== 'undefined';

function doGet(e) {
  var c = String((e && e.parameter && e.parameter.c) || '').replace(/[^a-z0-9]/g, '');
  // HTML 파일 이름을 조금 다르게 만들었어도 찾아 준다.
  var names = ['Index', 'index', 'Index.html', 'index.html', 'INDEX'], t = null;
  for (var i = 0; i < names.length && !t; i++) {
    try { t = HtmlService.createTemplateFromFile(names[i]); } catch (err) { t = null; }
  }
  if (!t) {
    return HtmlService.createHtmlOutput('<p style="font:20px sans-serif;padding:30px">HTML 파일을 찾을 수 없어요.<br>' +
      'Apps Script 편집기 왼쪽 파일 목록에 <b>Index.html</b> 파일이 있는지 확인하고, 저장한 뒤 새 버전으로 다시 배포해 주세요.</p>');
  }
  t.boot = JSON.stringify({ c: c, url: ScriptApp.getService().getUrl() || '' });
  return t.evaluate()
    .setTitle('우리 반 1인 1역')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

/* ---------- 작은 도우미 ---------- */

function str_(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/^\s+|\s+$/g, '');
}

function clamp_(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function today_() {
  return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
}

function ms_(d) {
  var p = d.split('-');
  return Date.UTC(+p[0], +p[1] - 1, +p[2]);
}

function dow_(d) {
  return new Date(ms_(d)).getUTCDay();
}

function addDays_(d, n) {
  return new Date(ms_(d) + n * 86400000).toISOString().slice(0, 10);
}

/** 시트 칸 값을 yyyy-MM-dd 문자열로. 날짜가 아니면 ''. */
function normDate_(v, tz) {
  if (v instanceof Date) return Utilities.formatDate(v, tz || TZ, 'yyyy-MM-dd');
  var s = str_(v);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
}

function marks_(n) {
  var s = '';
  for (var i = 0; i < n; i++) s += MARK;
  return s;
}

/** 칸 값: '○○' (도장 2개), '결석' 또는 '결석 ○○' (결석 처리 전에 찍은 도장 2개를 기억해 둔다) */
function parseCell_(v) {
  var s = str_(v), absent = s.indexOf(ABSENT) === 0;
  if (absent) s = s.slice(ABSENT.length);
  var n = 0;
  for (var i = 0; i < s.length; i++) if (s.charAt(i) === MARK) n++;
  if (!n && /^\d+$/.test(s)) n = parseInt(s, 10);
  return { count: n, absent: absent };
}

function cellText_(n, absent) {
  return absent ? ABSENT + (n > 0 ? ' ' + marks_(n) : '') : marks_(n);
}

/* ---------- 학급 목록 (스크립트 속성) ---------- */

function props_() {
  return PropertiesService.getScriptProperties();
}

function getClass_(code) {
  code = String(code || '').replace(/[^a-z0-9]/g, '');
  var raw = code ? props_().getProperty('class_' + code) : null;
  if (!raw) throw new Error('학급을 찾을 수 없어요.');
  var c = JSON.parse(raw);
  c.code = code;
  return c;
}

function putClass_(c) {
  var i = classInfo_(c);
  props_().setProperty('class_' + c.code, JSON.stringify({
    name: c.name, sheetId: c.sheetId, pw: c.pw, sound: i.sound, align: i.align, lock: i.lock, ue: i.ue, goal: i.goal, voice: i.voice
  }));
}

/**
 * 학급 설정 (화면에 보내는 것)
 *   lock  : 수업 시간 잠금. '1|0900-0940,0950-1030' (앞 숫자 1 = 켬, 0 = 끔), '' = 설정 안 함
 *   ue    : 참이면 학생도 [지우기] 버튼을 쓸 수 있다. 거짓이면 선생님만 (이름표 길게 누르기)
 *   goal  : 학급 목표. '10|20261118|피자 파티' (모두 다 한 날 10일, 시작 날짜, 보상), '' = 없음
 *   voice : 칭찬 음성
 */
function classInfo_(c) {
  return {
    name: c.name, sound: c.sound !== false, align: c.align === 'low' ? 'low' : '',
    lock: LOCK_RE_.test(c.lock || '') ? c.lock : '', ue: !!c.ue, goal: GOAL_RE_.test(c.goal || '') ? c.goal : '', voice: !!c.voice
  };
}
var LOCK_RE_ = /^[01]\|(\d{4}-\d{4}(,\d{4}-\d{4}){0,11})?$/;
var GOAL_RE_ = /^\d{1,3}\|\d{8}\|[^|]{0,30}$/;

function hash_(salt, pw) {
  var b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + pw, Utilities.Charset.UTF_8);
  var s = '';
  for (var i = 0; i < b.length; i++) {
    var v = (b[i] + 256) % 256;
    s += (v < 16 ? '0' : '') + v.toString(16);
  }
  return s;
}

function checkPw_(cls, pw) {
  if (hash_(cls.code, String(pw || '')) !== cls.pw) {
    Utilities.sleep(500);
    throw new Error('비밀번호가 맞지 않아요.');
  }
}

function parseSheetId_(url) {
  var s = str_(url);
  var m = s.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(s)) return s;
  throw new Error('스프레드시트 주소가 올바르지 않아요. 주소창의 주소를 그대로 붙여 넣어 주세요.');
}

function sheetUrl_(id) {
  return 'https://docs.google.com/spreadsheets/d/' + id + '/edit';
}

function openBook_(cls) {
  try {
    return SpreadsheetApp.openById(cls.sheetId);
  } catch (err) {
    if (err && err.need) throw err;   // 웹 버전: 시트를 먼저 읽어 와야 한다는 신호
    throw new Error('스프레드시트를 열 수 없어요. 이 앱을 설치한 구글 계정으로 만든 시트인지 확인해 주세요. 다른 계정의 시트라면 설치한 계정을 편집자로 공유해야 해요.');
  }
}

/* ---------- 시트 읽기 ---------- */

function sheet_(ss, name, head) {
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name, ss.getSheets().length);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, head.length).setValues([head]);
    tidySheet_(sh, name);
  }
  return sh;
}

/** 시트 크기가 모자라면 늘린다. (범위를 벗어나 쓰면 오류가 나므로) */
function grow_(sh, rows, cols) {
  var mc = sh.getMaxColumns(), mr = sh.getMaxRows();
  if (mc < cols) sh.insertColumnsAfter(mc, cols - mc + 10);
  if (mr < rows) sh.insertRowsAfter(mr, rows - mr + 20);
}

/** 꾸미기는 실패해도 기록에는 지장이 없도록 감싼다. */
function safe_(fn) {
  try { fn(); } catch (err) { if (STRICT_ || (err && err.need)) throw err; }
}

function headStyle_(rng) {
  rng.setBackground(C_HEAD).setFontColor('#ffffff').setFontWeight('bold')
    .setHorizontalAlignment('center').setVerticalAlignment('middle');
}

/** 명단 · 기록 · 쉬는날 시트를 보기 좋게 정리한다. 여러 번 불러도 결과가 같다. */
function tidySheet_(sh, name) {
  safe_(function () {
    var rows = Math.max(sh.getLastRow(), 2), cols = Math.max(sh.getLastColumn(), 3);
    var maxR = sh.getMaxRows(), maxC = sh.getMaxColumns();
    sh.setFrozenRows(1);
    sh.setRowHeight(1, 32);
    if (name === SH_ROSTER) {
      sh.setTabColor('#4a90c9');
      var w = [60, 110, 230, 60, 90];
      for (var i = 0; i < w.length; i++) sh.setColumnWidth(i + 1, w[i]);
      headStyle_(sh.getRange(1, 1, 1, 5));
      sh.getRange(2, 1, maxR - 1, 5).setVerticalAlignment('middle').setHorizontalAlignment('center');
      sh.getRange(2, 2, maxR - 1, 2).setHorizontalAlignment('left');
      sh.getRange(1, 1, rows, 5).setBorder(true, true, true, true, true, true, C_LINE, SpreadsheetApp.BorderStyle.SOLID);
    } else if (name === SH_LOG) {
      sh.setTabColor('#5fae57');
      sh.setColumnWidth(1, 60); sh.setColumnWidth(2, 110); sh.setColumnWidth(3, 210);
      if (maxC > 3) {
        sh.setFrozenColumns(3);
        sh.setColumnWidths(4, maxC - 3, 96);
        sh.getRange(1, 4, maxR, maxC - 3).setHorizontalAlignment('center');
      }
      headStyle_(sh.getRange(1, 1, 1, cols));
      sh.getRange(2, 1, maxR - 1, 1).setHorizontalAlignment('center');
      sh.getRange(1, 1, maxR, maxC).setVerticalAlignment('middle');
      sh.getRange(1, 1, rows, cols).setBorder(true, true, true, true, true, true, C_LINE, SpreadsheetApp.BorderStyle.SOLID);
      var body = sh.getRange(2, 4, maxR - 1, Math.max(maxC - 3, 1));
      sh.setConditionalFormatRules([
        SpreadsheetApp.newConditionalFormatRule().whenTextContains(ABSENT).setBackground('#e8e8e8').setFontColor('#888888').setRanges([body]).build(),
        SpreadsheetApp.newConditionalFormatRule().whenTextContains(MARK).setBackground('#fff4c7').setFontColor('#c0392b').setRanges([body]).build()
      ]);
    } else if (name === SH_REST) {
      sh.setTabColor('#f39a2b');
      sh.setColumnWidth(1, 120); sh.setColumnWidth(2, 120); sh.setColumnWidth(3, 240);
      headStyle_(sh.getRange(1, 1, 1, 3));
      sh.getRange(2, 1, maxR - 1, 2).setHorizontalAlignment('center');
      sh.getRange(1, 1, rows, 3).setBorder(true, true, true, true, true, true, C_LINE, SpreadsheetApp.BorderStyle.SOLID);
    }
  });
}

function tidy_(ss) {
  tidySheet_(sheet_(ss, SH_LOG, LOG_HEAD), SH_LOG);
  tidySheet_(sheet_(ss, SH_ROSTER, ROSTER_HEAD), SH_ROSTER);
  tidySheet_(sheet_(ss, SH_REST, REST_HEAD), SH_REST);
}

function pct_(a, b) {
  return b ? Math.round(a / b * 100) + '%' : '-';
}

/**
 * 맨 앞 [요약] 시트를 다시 쓴다. st 는 buildState_ 결과.
 * full 이 참이면 칸 합치기, 색, 너비 같은 꾸밈도 다시 한다.
 */
function writeSummary_(cls, ss, st, full) {
  var sh = ss.getSheetByName(SH_SUM);
  if (!sh) { sh = ss.insertSheet(SH_SUM, 0); full = true; }
  var a = st.students, n = a.length;
  grow_(sh, SUM_TOP + n + 1, SUM_COLS);

  var present = 0, done = 0, absent = 0, wkFull = 0, wkDays = 0, moFull = 0, moDays = 0, rows = [];
  for (var i = 0; i < n; i++) {
    var s = a[i], ok = !s.absent && s.done >= s.target, wk = [], wkCount = 0;
    if (s.absent) absent++; else { present++; if (ok) done++; }
    for (var j = 0; j < st.week.length; j++) {
      var w = s.week[j];
      wk.push(w === 'full' ? '★' : w === 'part' ? '△' : w === 'absent' ? '결' : '');
      if (w === 'full') wkCount++;
      if (st.week[j].has && w !== 'absent') { wkDays++; if (w === 'full') wkFull++; }
    }
    moFull += s.monthFull; moDays += s.monthDays;
    rows.push([s.no, s.name, s.role, s.target,
      s.absent ? ABSENT : ok ? '완료' : s.done > 0 ? (s.done + ' / ' + s.target) : '-']
      .concat(wk, [wkCount + '일', s.monthFull + ' / ' + s.monthDays + '일', s.days ? s.total / s.days : '',
        (s.streak + (ok ? 1 : 0)) + '일', s.total]));
  }

  var blank = function () { var r = []; for (var k = 0; k < SUM_COLS; k++) r.push(''); return r; };
  var top = [blank(), blank(), blank(), blank(), blank()];
  top[0][0] = cls.name + ' 1인 1역 요약';
  top[1][0] = '기준: ' + Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm') + ' (' + WEEK_KO[st.dow] + '요일)' +
    (st.rest ? ' · 오늘은 쉬는 날(' + st.rest + ')' : '') + '   ※ 도장을 찍을 때마다 자동으로 다시 쓰이는 시트입니다. 직접 고치지 마세요.';
  var lab = [[0, '학생 수', n + '명'], [2, '오늘 다 한 친구', done + ' / ' + present + '명'], [3, '오늘 결석', absent + '명'],
    [5, '이번 주 달성률', pct_(wkFull, wkDays)], [10, '이번 달 달성률', pct_(moFull, moDays)], [12, '기록한 날', st.days + '일']];
  for (var q = 0; q < lab.length; q++) { top[3][lab[q][0]] = lab[q][1]; top[4][lab[q][0]] = lab[q][2]; }

  sh.getRange(1, 1, 5, SUM_COLS).setValues(top);
  sh.getRange(SUM_TOP, 1, 1, SUM_COLS).setValues([SUM_HEAD]);
  if (n) sh.getRange(SUM_TOP + 1, 1, n, SUM_COLS).setValues(rows);
  var last = sh.getLastRow();
  if (last > SUM_TOP + n) { sh.getRange(SUM_TOP + n + 1, 1, last - SUM_TOP - n, SUM_COLS).clear(); full = true; }

  if (full) safe_(function () {
    sh.setTabColor('#d8362b');
    sh.setHiddenGridlines(true);
    sh.setFrozenRows(SUM_TOP);
    var w = [56, 100, 200, 80, 90, 44, 44, 44, 44, 44, 76, 100, 96, 70, 96];
    for (var c = 0; c < w.length; c++) sh.setColumnWidth(c + 1, w[c]);
    sh.setRowHeight(1, 46); sh.setRowHeight(4, 26); sh.setRowHeight(5, 42); sh.setRowHeight(SUM_TOP, 32);

    sh.getRange(1, 1, 1, SUM_COLS).merge().setBackground(C_HEAD).setFontColor('#ffffff').setFontSize(18).setFontWeight('bold')
      .setHorizontalAlignment('left').setVerticalAlignment('middle');
    sh.getRange(2, 1, 1, SUM_COLS).merge().setFontColor('#777777').setFontSize(9).setHorizontalAlignment('left');

    var box = [[1, 2], [3, 1], [4, 2], [6, 5], [11, 2], [13, 3]];
    for (var b = 0; b < box.length; b++) {
      var l = sh.getRange(4, box[b][0], 1, box[b][1]), v = sh.getRange(5, box[b][0], 1, box[b][1]);
      if (box[b][1] > 1) { l.merge(); v.merge(); }
      l.setBackground(C_SOFT).setFontSize(10).setFontWeight('bold').setFontColor('#44546a').setHorizontalAlignment('center').setVerticalAlignment('middle');
      v.setFontSize(16).setFontWeight('bold').setHorizontalAlignment('center').setVerticalAlignment('middle');
      sh.getRange(4, box[b][0], 2, box[b][1]).setBorder(true, true, true, true, null, null, C_LINE, SpreadsheetApp.BorderStyle.SOLID);
    }

    headStyle_(sh.getRange(SUM_TOP, 1, 1, SUM_COLS));
    if (n) {
      var body = sh.getRange(SUM_TOP + 1, 1, n, SUM_COLS);
      body.setHorizontalAlignment('center').setVerticalAlignment('middle').setFontSize(11).setFontWeight('normal').setFontColor('#222222')
        .setBorder(true, true, true, true, true, true, C_LINE, SpreadsheetApp.BorderStyle.SOLID);
      sh.getRange(SUM_TOP + 1, 2, n, 2).setHorizontalAlignment('left');
      sh.getRange(SUM_TOP + 1, 2, n, 1).setFontWeight('bold');
      sh.getRange(SUM_TOP + 1, 13, n, 1).setNumberFormat('0%');
      var bg = [];
      for (var r = 0; r < n; r++) { var line = []; for (var k = 0; k < SUM_COLS; k++) line.push(r % 2 ? '#f7f9fb' : '#ffffff'); bg.push(line); }
      body.setBackgrounds(bg);
      var marks = sh.getRange(SUM_TOP + 1, 5, n, 6);
      sh.setConditionalFormatRules([
        SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('완료').setBackground('#d9f2d0').setFontColor('#2e7d32').setBold(true).setRanges([marks]).build(),
        SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo(ABSENT).setBackground('#e8e8e8').setFontColor('#888888').setRanges([marks]).build(),
        SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('결').setBackground('#e8e8e8').setFontColor('#888888').setRanges([marks]).build(),
        SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('★').setFontColor('#e09a00').setRanges([marks]).build(),
        SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('△').setFontColor('#999999').setRanges([marks]).build()
      ]);
    }
  });
}

function readRoster_(ss) {
  var v = sheet_(ss, SH_ROSTER, ROSTER_HEAD).getDataRange().getValues();
  var out = [], seen = {};
  for (var i = 1; i < v.length; i++) {
    var name = str_(v[i][1]);
    if (!name) continue;
    var no = str_(v[i][0]) || name;
    if (seen['k' + no]) continue;
    seen['k' + no] = true;
    out.push({
      no: no, name: name, role: str_(v[i][2]), icon: str_(v[i][3]),
      target: clamp_(parseInt(v[i][4], 10) || 1, 1, MAX_TARGET)
    });
  }
  return out;
}

function readLog_(ss) {
  var sh = sheet_(ss, SH_LOG, LOG_HEAD);
  var v = sh.getDataRange().getValues();
  var tz = ss.getSpreadsheetTimeZone();
  var dateCol = {}, rowOf = {};
  for (var c = 3; c < v[0].length; c++) {
    var d = normDate_(v[0][c], tz);
    if (d && dateCol[d] === undefined) dateCol[d] = c;
  }
  for (var r = 1; r < v.length; r++) {
    var k = 'k' + str_(v[r][0]);
    if (k !== 'k' && rowOf[k] === undefined) rowOf[k] = r;
  }
  return { sh: sh, v: v, dateCol: dateCol, rowOf: rowOf };
}

function readRest_(ss) {
  var v = sheet_(ss, SH_REST, REST_HEAD).getDataRange().getValues();
  var tz = ss.getSpreadsheetTimeZone();
  var out = [];
  for (var i = 1; i < v.length; i++) {
    var a = normDate_(v[i][0], tz);
    if (!a) continue;
    var b = normDate_(v[i][1], tz) || a;
    if (b < a) b = a;
    out.push({ start: a, end: b, name: str_(v[i][2]) });
  }
  return out;
}

function restReason_(d, rest) {
  for (var i = 0; i < rest.length; i++) {
    if (d >= rest[i].start && d <= rest[i].end) return rest[i].name || '쉬는 날';
  }
  var w = dow_(d);
  return (w === 0 || w === 6) ? '주말' : '';
}

/* ---------- 화면에 필요한 상태 만들기 ---------- */

function buildState_(cls, ss) {
  var roster = readRoster_(ss), log = readLog_(ss), rest = readRest_(ss);
  var today = today_();
  var dates = [];
  for (var d in log.dateCol) dates.push(d);
  dates.sort();

  var monday = addDays_(today, -((dow_(today) + 6) % 7));
  var week = [];
  for (var i = 0; i < 5; i++) {
    var wd = addDays_(monday, i);
    week.push({ date: wd, rest: !!restReason_(wd, rest), has: log.dateCol[wd] !== undefined });
  }
  var month = today.slice(0, 7);

  var students = [];
  for (var s = 0; s < roster.length; s++) {
    var st = roster[s];
    var row = log.rowOf['k' + st.no];
    var cellAt = function (date) {
      var c = log.dateCol[date];
      if (row === undefined || c === undefined || c >= log.v[row].length) return null;
      return parseCell_(log.v[row][c]);
    };
    var total = 0, days = 0, monthFull = 0, monthDays = 0, streak = 0, streakOpen = true;
    for (var k = dates.length - 1; k >= 0; k--) {
      var cell = cellAt(dates[k]) || { count: 0, absent: false };
      var full = !cell.absent && cell.count >= st.target;
      if (full) total++;
      if (!cell.absent) days++;
      if (dates[k].slice(0, 7) === month && !cell.absent) {
        monthDays++;
        if (full) monthFull++;
      }
      if (dates[k] < today && streakOpen && !cell.absent) {
        if (full) streak++; else streakOpen = false;
      }
    }
    var wk = [];
    for (var j = 0; j < week.length; j++) {
      var wc = cellAt(week[j].date);
      if (wc && wc.absent) wk.push('absent');
      else if (wc && wc.count >= st.target) wk.push('full');
      else if (wc && wc.count > 0) wk.push('part');
      else if (week[j].date > today) wk.push('future');
      else if (week[j].rest) wk.push('rest');
      else wk.push('none');
    }
    var now = cellAt(today) || { count: 0, absent: false };
    students.push({
      no: st.no, name: st.name, role: st.role, icon: st.icon, target: st.target,
      done: Math.min(now.count, st.target), absent: now.absent,
      streak: streak, week: wk, monthFull: monthFull, monthDays: monthDays, total: total, days: days
    });
  }

  // 학급 목표: 시작한 날부터 어제까지, 출석한 친구가 모두 다 한 날 수 (오늘은 화면에서 실시간으로 더한다)
  var info = classInfo_(cls), goalPast = 0;
  if (info.goal) {
    var gs = info.goal.split('|')[1], gStart = gs.slice(0, 4) + '-' + gs.slice(4, 6) + '-' + gs.slice(6, 8);
    for (var g = 0; g < dates.length; g++) {
      if (dates[g] < gStart || dates[g] >= today) continue;
      var gc = log.dateCol[dates[g]], present = 0, full = 0;
      for (var q = 0; q < roster.length; q++) {
        var rr = log.rowOf['k' + roster[q].no];
        var cell = rr === undefined || gc >= log.v[rr].length ? { count: 0, absent: false } : parseCell_(log.v[rr][gc]);
        if (cell.absent) continue;
        present++;
        if (cell.count >= roster[q].target) full++;
      }
      if (present && full === present) goalPast++;
    }
  }

  return {
    code: cls.code, name: info.name, sound: info.sound, align: info.align, lock: info.lock, ue: info.ue, goal: info.goal, voice: info.voice,
    goalPast: goalPast, today: today, dow: dow_(today), rest: restReason_(today, rest),
    week: week, students: students, days: dates.length
  };
}

/* ---------- 누구나 부를 수 있는 함수 ---------- */

function listClasses() {
  var all = props_().getProperties(), out = [];
  for (var k in all) {
    if (k.indexOf('class_') !== 0) continue;
    try { out.push({ code: k.slice(6), name: JSON.parse(all[k]).name }); } catch (err) { /* 건너뜀 */ }
  }
  out.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  return out;
}

function createClass(name, sheetUrl, pw) {
  name = str_(name).slice(0, 20);
  pw = String(pw || '');
  if (!name) throw new Error('학급 이름을 적어 주세요.');
  if (pw.length < 4) throw new Error('비밀번호는 4자 이상으로 정해 주세요.');
  var made = !str_(sheetUrl);
  var id = made ? SpreadsheetApp.create('1인 1역 기록 - ' + name).getId() : parseSheetId_(sheetUrl);
  var code = '';
  do {
    code = '';
    for (var i = 0; i < 6; i++) code += 'abcdefghjkmnpqrstuvwxyz23456789'.charAt(Math.floor(Math.random() * 31));
  } while (props_().getProperty('class_' + code));
  var cls = { code: code, name: name, sheetId: id, sound: true };
  cls.pw = hash_(code, pw);
  var ss = openBook_(cls);
  tidy_(ss);
  writeSummary_(cls, ss, buildState_(cls, ss), true);
  // 새로 만든 파일이면 처음부터 있던 빈 시트는 지운다.
  if (made) safe_(function () {
    var all = ss.getSheets(), keep = [SH_SUM, SH_LOG, SH_ROSTER, SH_REST];
    for (var k = 0; k < all.length; k++) if (keep.indexOf(all[k].getName()) < 0) ss.deleteSheet(all[k]);
  });
  putClass_(cls);
  return { code: code };
}

function getState(code) {
  var cls = getClass_(code);
  return buildState_(cls, openBook_(cls));
}

/** 오늘 칸을 고친다. fn(현재 칸, 학생) -> { text: 새 값, out: 돌려줄 값 } */
function mutate_(cls, no, date, fn) {
  if (date !== today_()) return { stale: true };
  // 스크립트 잠금은 모든 학급이 함께 쓰므로, 도장 칸을 읽고 쓰는 동안만 잡는다.
  // 요약 시트 다시 쓰기는 잠금을 푼 뒤에 한다. (여러 반이 쉬는 시간에 몰려도 덜 기다리게)
  var lock = LockService.getScriptLock(), ss, sh, fresh = false, out;
  lock.waitLock(20000);
  try {
    ss = openBook_(cls);
    var roster = readRoster_(ss), st = null;
    for (var i = 0; i < roster.length; i++) if (roster[i].no === String(no)) st = roster[i];
    if (!st) return { stale: true };
    var log = readLog_(ss);
    sh = log.sh;
    var c = log.dateCol[date];
    var r = log.rowOf['k' + st.no];
    var cur = '';
    if (r !== undefined && c !== undefined && c < log.v[r].length) cur = log.v[r][c];
    if (c === undefined) {
      c = Math.max(sh.getLastColumn(), 3);
      grow_(sh, 1, c + 1);
      sh.getRange(1, c + 1).setNumberFormat('@').setValue(date);
      fresh = true;
    }
    if (r === undefined) {
      r = Math.max(sh.getLastRow(), 1);
      grow_(sh, r + 1, 3);
      sh.getRange(r + 1, 1, 1, 3).setNumberFormat('@').setValues([[st.no, st.name, st.role]]);
      fresh = true;
    }
    var next = fn(parseCell_(cur), st);
    sh.getRange(r + 1, c + 1).setValue(next.text);
    SpreadsheetApp.flush();   // 잠금을 풀기 전에 시트에 확실히 쓴다
    out = next.out;
  } finally {
    lock.releaseLock();
  }
  if (fresh) tidySheet_(sh, SH_LOG);
  safe_(function () { writeSummary_(cls, ss, buildState_(cls, ss), false); });
  return out;
}

/** 학생이 터치했을 때. delta 는 +1(도장) 또는 -1(지우기). */
function record(code, no, delta, date) {
  var cls = getClass_(code);
  delta = delta > 0 ? 1 : -1;
  return mutate_(cls, no, date, function (cell, st) {
    // 결석인 날은 도장을 바꾸지 않는다. (결석을 풀면 원래 도장이 돌아온다)
    if (cell.absent) return { text: cellText_(cell.count, true), out: { no: st.no, done: 0, absent: true } };
    var n = clamp_(cell.count + delta, 0, st.target);
    return { text: marks_(n), out: { no: st.no, done: n } };
  });
}

/* ---------- 비밀번호가 필요한 함수 (설정) ---------- */

function auth(code, pw) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  var ss = openBook_(cls);
  return {
    name: cls.name, sound: cls.sound !== false, align: cls.align === 'low' ? 'low' : '', sheetUrl: sheetUrl_(cls.sheetId),
    lock: classInfo_(cls).lock, ue: !!cls.ue, goal: classInfo_(cls).goal, voice: !!cls.voice,
    roster: readRoster_(ss), rest: readRest_(ss), state: buildState_(cls, ss)
  };
}

function saveRoster(code, pw, list) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  var rows = [], seen = {};
  for (var i = 0; i < (list || []).length; i++) {
    var it = list[i] || {};
    var name = str_(it.name).slice(0, 12);
    if (!name) continue;
    var no = str_(it.no).slice(0, 6) || String(rows.length + 1);
    if (seen['k' + no]) throw new Error('번호가 겹쳐요: ' + no + '번');
    seen['k' + no] = true;
    rows.push([no, name, str_(it.role).slice(0, 20), str_(it.icon).slice(0, 8),
      clamp_(parseInt(it.target, 10) || 1, 1, MAX_TARGET)]);
  }
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var ss = openBook_(cls);
    var sh = sheet_(ss, SH_ROSTER, ROSTER_HEAD);
    var last = sh.getLastRow();
    if (last > 1) sh.getRange(2, 1, last - 1, ROSTER_HEAD.length).clearContent();
    if (rows.length) {
      grow_(sh, rows.length + 1, ROSTER_HEAD.length);
      sh.getRange(2, 1, rows.length, 1).setNumberFormat('@');
      sh.getRange(2, 1, rows.length, ROSTER_HEAD.length).setValues(rows);
    }
    // 기록 시트의 이름·역할을 맞추고, 아직 줄이 없는 친구는 명단 순서대로 줄을 만들어 둔다.
    var log = readLog_(ss), add = [];
    for (var j = 0; j < rows.length; j++) {
      var r = log.rowOf['k' + rows[j][0]];
      if (r === undefined) add.push([rows[j][0], rows[j][1], rows[j][2]]);
      else if (str_(log.v[r][1]) !== rows[j][1] || str_(log.v[r][2]) !== rows[j][2]) {
        log.sh.getRange(r + 1, 2, 1, 2).setValues([[rows[j][1], rows[j][2]]]);
      }
    }
    if (add.length) {
      var at = Math.max(log.sh.getLastRow(), 1);
      grow_(log.sh, at + add.length, 3);
      log.sh.getRange(at + 1, 1, add.length, 3).setNumberFormat('@').setValues(add);
    }
    tidy_(ss);
    var state = buildState_(cls, ss);
    writeSummary_(cls, ss, state, true);
    return state;
  } finally {
    lock.releaseLock();
  }
}

function setAbsent(code, pw, no, absent, date) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  var out = mutate_(cls, no, date, function (cell, st) {
    var n = Math.min(cell.count, st.target);
    return { text: cellText_(n, !!absent), out: { no: st.no, absent: !!absent, done: absent ? 0 : n } };
  });
  // 스티커판 통계(이번 달 일수 등)가 바로 맞도록 학급 전체 상태도 함께 돌려준다.
  if (out && !out.stale) out.state = buildState_(cls, openBook_(cls));
  return out;
}

function saveRest(code, pw, list) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  var rows = [];
  for (var i = 0; i < (list || []).length; i++) {
    var a = normDate_(list[i].start), b = normDate_(list[i].end) || a;
    if (!a) continue;
    if (b < a) b = a;
    rows.push([a, b, str_(list[i].name).slice(0, 20)]);
  }
  rows.sort(function (x, y) { return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0; });
  var ss = openBook_(cls);
  var sh = sheet_(ss, SH_REST, REST_HEAD);
  var last = sh.getLastRow();
  if (last > 1) sh.getRange(2, 1, last - 1, 3).clearContent();
  if (rows.length) {
    grow_(sh, rows.length + 1, 3);
    sh.getRange(2, 1, rows.length, 3).setNumberFormat('@').setValues(rows);
  }
  tidySheet_(sh, SH_REST);
  var state = buildState_(cls, ss);
  safe_(function () { writeSummary_(cls, ss, state, false); });
  return state;
}

/** 학급 이름, 효과음, 비밀번호, 스프레드시트 주소 변경. 바꿀 것만 넣는다. */
function updateClass(code, pw, change) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  change = change || {};
  if (change.name !== undefined) {
    var name = str_(change.name).slice(0, 20);
    if (!name) throw new Error('학급 이름을 적어 주세요.');
    cls.name = name;
  }
  if (change.sound !== undefined) cls.sound = !!change.sound;
  if (change.align !== undefined) cls.align = change.align === 'low' ? 'low' : '';
  if (change.ue !== undefined) cls.ue = !!change.ue;
  if (change.voice !== undefined) cls.voice = !!change.voice;
  if (change.lock !== undefined) {
    var lk = str_(change.lock);
    if (lk && !LOCK_RE_.test(lk)) throw new Error('수업 시간 형식이 올바르지 않아요.');
    cls.lock = lk;
  }
  if (change.goal !== undefined) {
    var gl = str_(change.goal);
    if (gl && !GOAL_RE_.test(gl)) throw new Error('목표는 1~999일, 보상은 30자까지 적어 주세요.');
    if (gl && +gl.split('|')[0] < 1) throw new Error('목표 일수는 1일 이상이어야 해요.');
    cls.goal = gl;
  }
  if (change.newPw !== undefined) {
    if (String(change.newPw).length < 4) throw new Error('비밀번호는 4자 이상으로 정해 주세요.');
    cls.pw = hash_(cls.code, String(change.newPw));
  }
  var copied = false;
  var made = !!change.newSheet;
  if (made || change.sheetUrl !== undefined) {
    // newSheet 이면 배포한 선생님의 드라이브에 새 파일을 만들어 그쪽으로 옮긴다.
    var id = made
      ? SpreadsheetApp.create('1인 1역 기록 - ' + cls.name + ' (' + today_() + ')').getId()
      : parseSheetId_(change.sheetUrl);
    if (id !== cls.sheetId) {
      var oldBook = openBook_(cls);
      var next = { sheetId: id };
      var ss = openBook_(next);
      var rs = sheet_(ss, SH_ROSTER, ROSTER_HEAD);
      sheet_(ss, SH_LOG, LOG_HEAD);
      var hs = sheet_(ss, SH_REST, REST_HEAD);
      // 새 시트에 명단이 없으면 지금 명단과 쉬는 날을 옮겨 준다.
      if (rs.getLastRow() <= 1) {
        var roster = readRoster_(oldBook), rest = readRest_(oldBook), a = [], b = [];
        for (var i = 0; i < roster.length; i++) a.push([roster[i].no, roster[i].name, roster[i].role, roster[i].icon, roster[i].target]);
        for (var j = 0; j < rest.length; j++) b.push([rest[j].start, rest[j].end, rest[j].name]);
        if (a.length) {
          rs.getRange(2, 1, a.length, 1).setNumberFormat('@');
          rs.getRange(2, 1, a.length, 5).setValues(a);
          copied = true;
        }
        if (b.length && hs.getLastRow() <= 1) hs.getRange(2, 1, b.length, 3).setNumberFormat('@').setValues(b);
      }
      cls.sheetId = id;
    }
  }
  putClass_(cls);
  if (change.name !== undefined || change.sheetUrl !== undefined || made) {
    safe_(function () {
      var book = openBook_(cls);
      tidy_(book);
      writeSummary_(cls, book, buildState_(cls, book), true);
      if (made) {
        var all = book.getSheets(), keep = [SH_SUM, SH_LOG, SH_ROSTER, SH_REST];
        for (var k = 0; k < all.length; k++) if (keep.indexOf(all[k].getName()) < 0) book.deleteSheet(all[k]);
      }
    });
  }
  var ci = classInfo_(cls);
  return { name: cls.name, sound: ci.sound, align: ci.align, lock: ci.lock, ue: ci.ue, goal: ci.goal, voice: ci.voice,
    sheetUrl: sheetUrl_(cls.sheetId), copied: copied };
}

/** 학급을 목록에서 지운다. 스프레드시트는 그대로 남는다. */
function deleteClass(code, pw) {
  var cls = getClass_(code);
  checkPw_(cls, pw);
  props_().deleteProperty('class_' + cls.code);
  return true;
}

/* ---------- 설치 점검 ---------- */

/**
 * 설치가 잘 되었는지 실제 구글 시트로 확인한다.
 * 편집기 위쪽 함수 목록에서 [설치점검]을 고르고 [실행]을 누른 뒤, 아래 실행 로그를 본다.
 * 점검용 스프레드시트 하나를 드라이브에 만들어 쓰며, 끝난 뒤 지워도 된다.
 */
function 설치점검() {
  var out = [], bad = 0;
  var check = function (name, ok, detail) {
    if (!ok) bad++;
    out.push((ok ? '✅ ' : '❌ ') + name + (ok || !detail ? '' : '  →  ' + detail));
  };
  var CODE = 'selftest', PW = 'selftest-pw';
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    // 1. 점검용 스프레드시트 준비 (있으면 다시 쓴다)
    var id = props_().getProperty('selftest_id'), ss = null;
    if (id) { try { ss = SpreadsheetApp.openById(id); } catch (err) { ss = null; } }
    if (!ss) {
      ss = SpreadsheetApp.create('1인 1역 설치 점검용 (지워도 됩니다)');
      props_().setProperty('selftest_id', ss.getId());
    }
    var tmp = ss.getSheetByName('임시') || ss.insertSheet('임시', 0);
    var old = ss.getSheets();
    for (var i = 0; i < old.length; i++) if (old[i].getName() !== '임시') ss.deleteSheet(old[i]);
    check('스프레드시트 만들기', true);

    var cls = { code: CODE, name: '설치 점검반', sheetId: ss.getId(), sound: true };
    cls.pw = hash_(CODE, PW);
    putClass_(cls);
    var today = today_();

    // 2. 명단 저장
    var st = saveRoster(CODE, PW, [
      { no: '1', name: '가람', role: '칠판 지우기', icon: '', target: 3 },
      { no: '2', name: '나래', role: '칠판 지우기', icon: '', target: 3 },
      { no: '3', name: '다온', role: '우유 나르기', icon: '', target: 1 }
    ]);
    check('명단 저장', st.students.length === 3, '학생 수 ' + st.students.length);
    ss.deleteSheet(tmp);
    var names = [], all = ss.getSheets();
    for (var k = 0; k < all.length; k++) names.push(all[k].getName());
    check('시트 구성 (요약이 맨 앞)', names[0] === SH_SUM && names.length === 4, names.join(', '));

    // 3. 도장 찍기와 지우기
    var r1 = record(CODE, '3', 1, today);
    check('도장 찍기', r1.done === 1, JSON.stringify(r1));
    record(CODE, '1', 1, today);
    var r2 = record(CODE, '1', 1, today);
    check('하루 여러 번 하는 역할', r2.done === 2, JSON.stringify(r2));
    var r3 = record(CODE, '1', -1, today);
    check('도장 지우기', r3.done === 1, JSON.stringify(r3));
    for (var n = 0; n < 5; n++) record(CODE, '2', 1, today);
    var log = readLog_(ss), col = log.dateCol[today];
    var cellOf = function (no) { var row = log.rowOf['k' + no]; return row === undefined || col === undefined ? '(없음)' : String(log.v[row][col]); };
    check('기록 시트에 ○ 저장', cellOf('3') === MARK && cellOf('1') === MARK && cellOf('2') === MARK + MARK + MARK,
      [cellOf('1'), cellOf('2'), cellOf('3')].join(' | '));
    check('어제 날짜로는 저장 안 됨', record(CODE, '3', 1, addDays_(today, -1)).stale === true);

    // 4. 결석
    var ab = setAbsent(CODE, PW, '3', true, today);
    check('결석 표시', ab.absent === true && getState(CODE).students[2].absent === true);
    var un = setAbsent(CODE, PW, '3', false, today);
    check('결석 해제 뒤 도장 복원', un.done === 1 && getState(CODE).students[2].done === 1, JSON.stringify({ done: un.done }));

    // 5. 쉬는 날
    var far = addDays_(today, 400);
    saveRest(CODE, PW, [{ start: far, end: addDays_(far, 2), name: '점검용 방학' }]);
    var rest = readRest_(ss);
    check('쉬는 날 저장', rest.length === 1 && rest[0].start === far && rest[0].name === '점검용 방학', JSON.stringify(rest));

    // 6. 화면에 보낼 상태와 요약 시트
    var now = getState(CODE), a = now.students;
    check('화면 상태', a[0].done === 1 && a[1].done === 3 && a[2].done === 1 && !a[2].absent,
      a[0].done + ', ' + a[1].done + ', ' + a[2].done);
    var sum = ss.getSheetByName(SH_SUM).getDataRange().getValues();
    check('요약 시트 제목', String(sum[0][0]).indexOf('설치 점검반') === 0, String(sum[0][0]));
    check('요약 시트 현황', String(sum[4][0]) === '3명' && String(sum[4][2]) === '2 / 3명', sum[4][0] + ' | ' + sum[4][2]);
    check('요약 시트 학생 표', String(sum[SUM_TOP][1]) === '가람' && String(sum[SUM_TOP][4]) === '1 / 3' && String(sum[SUM_TOP + 1][4]) === '완료',
      sum[SUM_TOP][1] + ' | ' + sum[SUM_TOP][4] + ' | ' + sum[SUM_TOP + 1][4]);

    // 7. 날짜 열이 시트 너비(26칸)를 넘어가도 저장되는지
    var sh = log.sh, past = [];
    for (var d = 40; d >= 1; d--) past.push(addDays_(today, -d - 400));
    grow_(sh, 1, 4 + past.length);
    var lastCol = sh.getLastColumn();
    sh.getRange(1, lastCol + 1, 1, past.length).setNumberFormat('@').setValues([past]);
    sh.getRange(1, col + 1).setValue('');   // 오늘 열의 머리글을 지워 새 열이 맨 끝에 생기게 한다
    var wide = record(CODE, '1', 1, today), end = sh.getLastColumn();
    check('날짜가 많아져도 저장', wide.done === 1 && end === lastCol + past.length + 1, '마지막 열 ' + end);

    // 8. 비밀번호
    var denied = false;
    try { auth(CODE, 'wrong'); } catch (err2) { denied = true; }
    check('틀린 비밀번호 거절', denied);
    check('맞는 비밀번호 통과', auth(CODE, PW).roster.length === 3);

    // 9. 운영 설정 (수업 시간 잠금, 지우기 권한, 학급 목표, 칭찬 음성)
    updateClass(CODE, PW, { lock: '1|0000-0001,2358-2359', ue: true, voice: true, goal: '3|' + addDays_(today, -1).replace(/-/g, '') + '|점검 보상' });
    var os = getState(CODE);
    check('운영 설정 저장', os.lock === '1|0000-0001,2358-2359' && os.ue === true && os.voice === true && os.goal.indexOf('3|') === 0 && os.goalPast === 0,
      JSON.stringify({ lock: os.lock, ue: os.ue, voice: os.voice, goal: os.goal, goalPast: os.goalPast }));
    var badLock = false;
    try { updateClass(CODE, PW, { lock: '1|9시-10시' }); } catch (e4) { badLock = true; }
    check('잘못된 시간표 거절', badLock);

    // 10. 시트 꾸미기 (실패해도 기록에는 지장 없음)
    STRICT_ = true;
    try {
      tidy_(ss);
      writeSummary_(cls, ss, buildState_(cls, ss), true);
      check('시트 꾸미기', true);
    } catch (err3) {
      out.push('⚠️ 시트 꾸미기 일부 실패 (기록에는 지장 없음)  →  ' + err3.message);
    }
    STRICT_ = false;
  } catch (err) {
    check('점검 도중 오류', false, err.message);
  } finally {
    STRICT_ = false;
    props_().deleteProperty('class_' + CODE);
    lock.releaseLock();
  }
  out.push('');
  out.push(bad ? '❌ ' + bad + '개 항목에 문제가 있어요. 위 내용을 그대로 복사해 문의해 주세요.'
    : '🎉 모든 점검을 통과했어요. 이제 [배포]를 하시면 됩니다.');
  out.push('(드라이브에 생긴 "1인 1역 설치 점검용" 파일은 지워도 됩니다.)');
  var text = out.join('\n');
  Logger.log('\n' + text);
  return text;
}

</script>
<script>
/*
 * 웹 버전 연결부.
 *
 * Code.gs 는 원래 구글 Apps Script 서버에서 돌지만, 웹 버전에서는 같은 코드를 브라우저에서 그대로 돌린다.
 * 이 파일이 Apps Script 가 주던 것(SpreadsheetApp, PropertiesService 등)을 흉내 내고,
 * 실제 읽기·쓰기는 로그인한 사용자의 권한으로 Google Sheets API / Drive API 에 보낸다.
 *
 *   읽기 : 스프레드시트 전체를 메모리로 가져온다 (요청 2번)
 *   실행 : Code.gs 함수가 메모리 위에서 한 번에 돈다
 *   쓰기 : 바뀐 칸과 꾸밈을 모아 API 로 보낸다
 *
 * 학급 목록은 서버가 없으므로 드라이브 파일의 appProperties 에 적어 둔다.
 * 권한은 drive.file (이 앱이 만든 파일만) 하나뿐이다.
 */
(function (g) {
  'use strict';

  var CFG = g.ONE_ROLE_CONFIG || {};

  // 아주 오래된 브라우저(Promise, fetch 가 없음)에서는 "잠깐만요…"에 멈추지 않도록 이유를 알려 주고 멈춘다.
  if (!g.Promise || !g.fetch) {
    var OLD = '이 브라우저는 너무 오래되어 1인 1역을 열 수 없어요. 전자칠판의 앱 스토어(Play 스토어)에서 "Chrome"을 설치해 그 브라우저로 열어 주세요.';
    var dead = function (ok, fail) {
      var o = { withSuccessHandler: function (f) { return dead(f, fail); }, withFailureHandler: function (f) { return dead(ok, f); } };
      ['listClasses', 'createClass', 'getState', 'record', 'auth', 'saveRoster', 'setAbsent', 'saveRest', 'updateClass', 'deleteClass'].forEach(function (n) {
        o[n] = function () { setTimeout(function () { if (fail) fail(new Error(OLD)); }, 0); };
      });
      return o;
    };
    g.__RUN = function () { return dead(null, null); };
    g.ONE_ROLE = { local: function () { return true; }, googleReady: function () { return false; }, email: function () { return ''; } };
    return;
  }
  // 권한을 하나만 요청해야 구글 권한 화면에 체크 칸이 생기지 않고 [계속] 한 번으로 끝난다.
  var SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';
  var DRIVE = 'https://www.googleapis.com/drive/v3/files';
  var FRESH_MS = 45 * 1000;        // 이 시간 안에는 시트를 다시 읽지 않는다
  var MAX_AGE_MS = 5 * 60 * 1000;  // 계속 쓰고 있어도 이 시간이 지나면 다시 읽는다
  var NAMES = ['listClasses', 'createClass', 'getState', 'record', 'auth', 'saveRoster', 'setAbsent', 'saveRest', 'updateClass', 'deleteClass'];

  function ls(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { /* 저장소를 못 쓰는 브라우저 */ }
    return null;
  }

  /* ================= 로그인 ================= */

  var tok = null, tokExp = 0, client = null, requesting = false, reqTimer = 0, waiters = [];
  var email = ls('or_email') || '';

  function tokenOk(marginMs) { return !!tok && Date.now() < tokExp - (marginMs || 30000); }

  function gis() {
    if (client) return true;
    if (!(g.google && g.google.accounts && g.google.accounts.oauth2)) return false;
    client = g.google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId, scope: SCOPE,
      callback: function (r) {
        if (r && r.access_token) gotToken(r); else failToken((r && r.error) || 'denied');
      },
      error_callback: function (e) { failToken((e && e.type) || 'error'); }
    });
    return true;
  }

  var askConsent = false;   // 참이면 다음 로그인 때 권한 화면을 다시 보여 준다
  var NEED_BOX = '구글 드라이브 권한이 빠져 있어요. 다시 로그인해서 권한 화면의 <b>[계속]</b>을 눌러 주세요. 네모 칸이 보이면 체크해 주세요.';

  function gotToken(r) {
    requesting = false; clearTimeout(reqTimer);
    // 구글 권한 화면은 항목마다 체크하는 방식이라, 드라이브 칸을 빼고 허용하면 저장할 수 없는 로그인이 된다.
    if (String(r.scope || '').indexOf('auth/drive.file') < 0) {
      tok = null; tokExp = 0; askConsent = true; lastWhy = 'no_drive_scope';
      showLogin(NEED_BOX);
      return;
    }
    askConsent = false; lastWhy = '';
    tok = r.access_token;
    tokExp = Date.now() + (parseInt(r.expires_in, 10) || 3600) * 1000;
    hideLogin();
    var w = waiters; waiters = [];
    for (var i = 0; i < w.length; i++) w[i](tok);
    if (!email) {
      // 다음 로그인 때 같은 계정을 바로 고르기 위해, 드라이브 계정 정보에서 메일 주소만 읽어 브라우저에 적어 둔다.
      fetch('https://www.googleapis.com/drive/v3/about?fields=' + encodeURIComponent('user(emailAddress)'), { headers: { Authorization: 'Bearer ' + tok } })
        .then(function (res) { return res.ok ? res.json() : {}; })
        .then(function (j) { if (j && j.user && j.user.emailAddress) { email = j.user.emailAddress; ls('or_email', email); } })
        .catch(function () {});
    }
  }

  var lastWhy = '';   // 문제를 찾기 쉽도록 마지막 로그인 결과를 로그인 창 아래에 작게 보여 준다
  function failToken(why) {
    requesting = false; clearTimeout(reqTimer);
    lastWhy = String(why || '');
    showLogin(why === 'popup_failed_to_open' ? '로그인 창이 막혔어요. 주소창 오른쪽의 팝업 차단 표시를 눌러 <b>항상 허용</b>으로 바꾼 뒤 아래 버튼을 눌러 주세요.' :
      why === 'popup_closed' ? '로그인 창이 닫혔어요. 다시 눌러 계정을 고르고 <b>계속</b>을 눌러 주세요.' :
      why === 'access_denied' ? '권한을 허용해야 기록을 저장할 수 있어요.' :
      why === 'timeout' ? '로그인 응답이 없어요. 팝업 창이 뒤에 숨어 있지 않은지 확인하고 다시 눌러 주세요.' : '');
  }

  /** 로그인 창을 연다. 브라우저가 창을 막지 않도록 반드시 누르는 동작 안에서 불러야 한다. */
  function requestToken(pick) {
    if (requesting) return;
    if (!gis()) { lastWhy = 'gis_not_loaded'; showLogin('구글 로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하고, 광고 차단 프로그램을 쓰고 있다면 이 주소에서는 꺼 주세요. 그런 다음 새로 고쳐 주세요.'); return; }
    requesting = true;
    clearTimeout(reqTimer);
    reqTimer = setTimeout(function () { if (requesting) failToken('timeout'); }, 90000);
    var opt = { prompt: pick ? 'select_account' : askConsent ? 'consent' : '' };
    if (email && !pick) opt.login_hint = email;
    try { client.requestAccessToken(opt); } catch (e) { failToken('error'); }
  }

  /* ----- 저장 방식: 'google' = 구글 로그인 + 구글 시트, 'local' = 로그인 없이 이 기기의 브라우저에만 ----- */
  // 처음 여는 사람은 아무것도 고르지 않고 바로 쓴다(기기 저장). 구글 시트 방식은 설정에서 고를 때만 묻는다.
  var mode = ls('or_mode') || 'local', modeWaiters = [];
  if (mode === 'choose') mode = '';
  // 구글 시트 전용 주소(…/?g): 이 주소로 열면 처음부터 구글 시트 방식으로 연다.
  if (/[?&]g(=[^&]*)?(&|$)/.test(g.location.search)) { mode = 'google'; ls('or_mode', 'google'); }
  function isLocal() { return mode === 'local'; }
  function setMode(m) {
    if (m !== mode) { books = {}; classes = {}; listAt = 0; premade = {}; }
    mode = m; ls('or_mode', m); hideLogin();
    if (m === 'local' && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { /* 무시 */ } }
    var w = modeWaiters; modeWaiters = [];
    for (var i = 0; i < w.length; i++) w[i]();
  }
  function ensureMode() {
    if (mode) return Promise.resolve();
    return new Promise(function (resolve) { modeWaiters.push(resolve); showChooser(); });
  }
  function showChooser() {
    var d = document.getElementById('or-login');
    if (!d) {
      d = document.createElement('div'); d.id = 'or-login';
      d.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:200;display:flex;align-items:center;justify-content:center;' +
        'background:rgba(43,42,40,.55);padding:16px;font-family:Jua,sans-serif;overflow:auto';
      document.body.appendChild(d);
    }
    var card = 'display:block;width:100%;text-align:left;font:inherit;cursor:pointer;margin-top:12px;padding:14px 16px;border:2.5px solid #2b2a28;' +
      'border-radius:14px;box-shadow:3px 4px 0 rgba(43,42,40,.22);';
    d.innerHTML = '<div style="background:#fffdf6;border:3px solid #2b2a28;border-radius:14px 22px 16px 24px / 22px 14px 24px 16px;padding:24px;max-width:520px;width:100%;box-shadow:6px 8px 0 rgba(43,42,40,.3)">' +
      '<div style="font-size:27px;text-align:center">기록을 어디에 저장할까요?</div>' +
      '<button id="or-local" style="' + card + 'background:#f7cf3d"><span style="font-size:22px">이 기기에 저장하기 <small style="font-size:15px">(로그인 없음 · 추천)</small></span>' +
      '<br><span style="font:15px/1.5 sans-serif">이 기기의 브라우저에만 저장해요. 다른 기기에서는 볼 수 없고, 엑셀 파일로 내려받을 수 있어요.</span></button>' +
      (CFG.clientId ? '<button id="or-google" style="' + card + 'background:#fff"><span style="font-size:22px">구글 시트에 저장하기 <small style="font-size:15px">(구글 로그인)</small></span>' +
      '<br><span style="font:15px/1.5 sans-serif">내 구글 드라이브의 스프레드시트에 저장해요. 어느 기기에서든 로그인하면 이어서 쓸 수 있어요.</span></button>' : '') +
      '<div style="margin-top:14px;font:12px sans-serif;color:#999;text-align:center">언제든 다시 바꿀 수 있어요 · 버전 ' + (g.ONE_ROLE_BUILD || '-') + '</div></div>';
    document.getElementById('or-local').onclick = function () { setMode('local'); };
    var gg = document.getElementById('or-google');
    if (gg) gg.onclick = function () { setMode('google'); requestToken(false); };
  }

  function getToken() {
    if (tokenOk()) return Promise.resolve(tok);
    return new Promise(function (resolve) {
      waiters.push(resolve);
      if (!requesting) showLogin('');
    });
  }

  // 화면을 누를 때마다 확인해서, 로그인이 곧 끝나거나 끝났으면 그 누름을 이용해 조용히 갱신한다.
  document.addEventListener('click', function (ev) {
    if (mode !== 'google' || !CFG.clientId || !email || requesting) return;
    if (ev.target && ev.target.closest && ev.target.closest('#or-login')) return;
    if (!tokenOk(8 * 60 * 1000)) requestToken(false);
  }, true);

  function showLogin(msg) {
    var d = document.getElementById('or-login');
    if (!d) {
      d = document.createElement('div'); d.id = 'or-login';
      d.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:200;display:flex;align-items:center;justify-content:center;' +
        'background:rgba(43,42,40,.55);padding:16px;font-family:Jua,sans-serif';
      document.body.appendChild(d);
    }
    var box = 'background:#fffdf6;border:3px solid #2b2a28;border-radius:14px 22px 16px 24px / 22px 14px 24px 16px;padding:26px;max-width:460px;' +
      'text-align:center;box-shadow:6px 8px 0 rgba(43,42,40,.3)';
    if (!CFG.clientId) {
      d.innerHTML = '<div style="' + box + '"><div style="font-size:26px;margin-bottom:10px">아직 준비가 덜 됐어요</div>' +
        '<div style="font-size:17px;line-height:1.5">config.js 에 구글 로그인용 클라이언트 ID가 없습니다.<br>설정 안내서를 따라 넣어 주세요.</div></div>';
      return;
    }
    d.innerHTML = '<div style="' + box + '"><div style="font-size:28px;margin-bottom:8px">' + (email ? '다시 로그인해 주세요' : '구글 로그인이 필요해요') + '</div>' +
      '<div style="font-size:17px;line-height:1.5;margin-bottom:16px">' + (msg || (email ? esc(email) + ' 계정으로 이어서 씁니다.' : '기록은 로그인한 계정의 구글 드라이브에 저장돼요.')) + '</div>' +
      '<button id="or-go" style="font:inherit;font-size:22px;padding:12px 26px;background:#f7cf3d;border:2.5px solid #2b2a28;border-radius:14px;cursor:pointer;box-shadow:3px 4px 0 rgba(43,42,40,.22)">구글로 로그인</button>' +
      (email ? '<div style="margin-top:14px"><button id="or-other" style="font:inherit;font-size:16px;background:none;border:0;text-decoration:underline;cursor:pointer">다른 계정으로 로그인</button></div>' : '') +
      '<div style="margin-top:16px;padding:10px 12px;background:#eaf2fb;border-radius:10px;font:14px/1.5 sans-serif;text-align:left">' +
        '🔒 구글 비밀번호는 <b>구글 화면에만</b> 입력하고, 이 앱은 볼 수 없어요.<br>' +
        '앱이 볼 수 있는 것은 <b>이 앱이 만든 스프레드시트뿐</b>이에요. 메일이나 다른 파일은 볼 수 없어요.<br>' +
        '<a href="privacy.html#login" target="_blank" rel="noopener" style="color:#2b5c9a">로그인하면 무엇이 저장되나요? 자세히 보기</a></div>' +
      '<div style="margin-top:12px;font:12px sans-serif;color:#999">버전 ' + (g.ONE_ROLE_BUILD || '-') + (lastWhy ? ' · 상태: ' + esc(lastWhy) : '') + '</div>' +
      '</div>';
    document.getElementById('or-go').onclick = function () { requestToken(false); };
    var o = document.getElementById('or-other');
    if (o) o.onclick = function () { email = ''; ls('or_email', null); requestToken(true); };
  }
  function hideLogin() { var d = document.getElementById('or-login'); if (d) d.parentNode.removeChild(d); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  g.ONE_ROLE = {
    email: function () { return email; },
    logout: function () {
      try { if (tok && g.google && g.google.accounts) g.google.accounts.oauth2.revoke(tok, function () {}); } catch (e) { /* 무시 */ }
      tok = null; tokExp = 0; email = ''; ls('or_email', null);
      books = {}; classes = {}; listAt = 0;
    },
    local: isLocal,
    // 구글 로그인을 쓸 수 있는지 (클라이언트 ID가 설정되어 있는지)
    googleReady: function () { return !!CFG.clientId; },
    // 새로 고치지 않고 저장 방식을 바꾼다. 학급 목록은 새 방식에서 다시 읽는다.
    useMode: function (m) { setMode(m === 'google' ? 'google' : 'local'); },
    // 구글 로그인 창을 연다. 브라우저가 창을 막지 않도록 누르는 동작 안에서 불러야 한다.
    login: function () { if (mode === 'google' && !tokenOk()) requestToken(false); },
    // 저장 방식을 다시 고르게 한다. 이미 저장된 기록은 그대로 남는다.
    changeMode: function () { ls('or_mode', 'choose'); ls('c', null); g.location.reload(); },
    // 시트 한 장을 엑셀에서 열리는 CSV 글자로 돌려준다. (불러와 둔 학급만)
    csv: function (code, sheetName) {
      var c = classes[code], b = c && books[c.sheetId], sh = b && b.getSheetByName(sheetName);
      if (!sh) return '';
      var v = sh.getDataRange().getValues(), out = [];
      for (var i = 0; i < v.length; i++) {
        var line = [];
        for (var j = 0; j < v[i].length; j++) {
          var x = v[i][j]; x = typeof x === 'number' && sheetName === '요약' && j === 12 ? Math.round(x * 100) + '%' : String(x);
          line.push(/[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x);
        }
        out.push(line.join(','));

var bgCode = null;
function bgGet(){ var k = S.code; return k ? (store('bg_' + k) || '') : ''; }
function bgImg(){ var k = S.code; return k ? store('bgimg_' + k) : null; }
function applyBg(force){
  var key = (S.code || '') + '|' + bgGet() + '|' + (bgImg() ? bgImg().length : 0);
  if (!force && key === bgCode) return;
  bgCode = key;
  var b = document.body.style, img = bgImg(), v = bgGet(), p = BGS[0];
  for (var i = 0; i < BGS.length; i++) if (BGS[i][0] === v) p = BGS[i];

    b.backgroundColor = '#f6ecd2';
    b.backgroundImage = 'linear-gradient(rgba(255,253,246,.28),rgba(255,253,246,.28)),url(' + img + ')';
    b.backgroundSize = 'cover'; b.backgroundPosition = 'center'; b.backgroundAttachment = 'fixed';
    document.body.className = 'hasimg';
  } else {
    b.backgroundColor = p[2]; b.backgroundImage = p[3]; b.backgroundSize = p[4]; b.backgroundPosition = ''; b.backgroundAttachment = '';
    document.body.className = '';
  }
}
function bgSwatches(){
  var v = bgGet(), img = bgImg(), h = '<div class="swatches">';
  for (var i = 0; i < BGS.length; i++) {
    var p = BGS[i];
    h += '<button class="sw' + (v === p[0] || (!p[0] && v === 'img' && !img) ? ' on' : '') + '" data-act="bg" data-v="' + p[0] + '" style="background-color:' + p[2] +

/* 사진을 화면 크기에 맞게 줄이고 JPEG 로 바꿔 저장한다. (브라우저 저장 공간이 작으므로) */
function bgLoadFile(file){
  if (!file || !/^image\//.test(file.type)) { toast('사진 파일을 골라 주세요.'); return; }
  toast('사진을 맞추는 중이에요…');
  var url = (window.URL || window.webkitURL).createObjectURL(file), im = new Image();
  im.onload = function(){
    var max = 1600, w = im.naturalWidth, h = im.naturalHeight, r = Math.min(1, max / Math.max(w, h));
    var cv = document.createElement('canvas'); cv.width = Math.round(w * r); cv.height = Math.round(h * r);
    var c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(im, 0, 0, cv.width, cv.height);
    (window.URL || window.webkitURL).revokeObjectURL(url);
    // 브라우저 저장 공간(약 5MB)은 기록과 함께 쓰므로 사진 한 장은 450KB 아래로 맞춘다.
    var data = '', q = [0.8, 0.7, 0.6, 0.5, 0.4, 0.3];
    for (var i = 0; i < q.length; i++) { data = cv.toDataURL('image/jpeg', q[i]); if (data.length < 450000) break; }
    try {
      localStorage.setItem('bgimg_' + S.code, data);
      localStorage.setItem('bg_' + S.code, 'img');
    } catch (e) {
      toast('사진이 너무 커서 저장하지 못했어요. 더 작은 사진을 골라 주세요.'); return;
    }
    applyBg(true); render(); toast('배경 사진을 바꿨어요.');
  };
  im.onerror = function(){ toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); };
  im.src = url;
}

function setState(st){
  S.st = st; S.day = localDay(); S.loaded = Date.now();
  applyBg();
  if (isLocal() && !store('or_since')) store('or_since', String(Date.now()));
  for (var i = 0; i < st.students.length; i++) st.students[i].base = st.students[i].done >= st.students[i].target && !st.students[i].absent;
}
function refresh(){
  if (!S.code || S.q.length || S.busy) return;
  api('getState', [S.code], function(st){
    if (S.q.length || S.busy) return;
    setState(st);
    if (S.view === 'board' || S.view === 'stickers') render();
  }, function(){});
}
function streakNow(s){ return s.streak + (s.done >= s.target && !s.absent ? 1 : 0); }
function counts(){
  var a = S.st.students, n = 0, d = 0;
  for (var i = 0; i < a.length; i++) { if (a[i].absent) continue; n++; if (a[i].done >= a[i].target) d++; }
  return { n: n, d: d };
}

function fsOk(){

  return !!((d.fullscreenEnabled || d.webkitFullscreenEnabled) && (e.requestFullscreen || e.webkitRequestFullscreen));
}
function fsOn(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsBtn(){

}
function fsLabel(){ return fsOn() ? '⤡<span class="fslab"> 작게</span>' : '⤢<span class="fslab"> 전체화면</span>'; }
function fsToggle(){
  var d = document, e = d.documentElement;
  try {
    if (fsOn()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var p = (e.requestFullscreen || e.webkitRequestFullscreen).call(e); if (p && p.catch) p.catch(function(){ toast('전체화면을 쓸 수 없는 화면이에요.'); }); }
  } catch (err) { toast('전체화면을 쓸 수 없는 화면이에요.'); }

function cardHtml(s, i){

  var h = '<div class="' + cls + '" id="card-' + i + '" data-act="stamp" data-i="' + i + '" style="transform:rotate(' + tilt + 'deg)">';
  h += '<span class="no">' + esc(s.no) + '</span><div class="name' + (s.name.length > 4 ? ' long' : '') + '">' + esc(s.name) + '</div>';
  var rl = (s.role || '역할을 정해요').length;
  h += '<div class="role' + (rl > 10 ? ' s' : rl > 7 ? ' m' : '') + '"><i>' + esc(iconOf(s)) + '</i>' + esc(s.role || '역할을 정해요') + '</div>';
  h += '<div class="slots" id="slots-' + i + '">' + slotsHtml(s, i, -1) + '</div>';
  if (S.st.ue) h += '<button class="undo" data-act="undo" data-i="' + i + '">지우기</button>';

function slotsHtml(s, i, fresh){

    h += '<span class="slot' + (k < s.done ? ' on' : '') + '">' + (k < s.done ? stampSvg(i, k, k === fresh) : '<b>꾹</b>') + '</span>';
  return h;
}

function prog(c){
  c = c || counts();
  var bar = document.getElementById('bar'), num = document.getElementById('num');
  if (!bar) return;
  var pct = c.n ? Math.round(c.d / c.n * 100) : 0;
  bar.style.width = pct + '%'; bar.className = pct === 0 || pct === 100 ? 'zero' : '';
  num.textContent = c.d + ' / ' + c.n;
  var hn = document.getElementById('heronum'); if (hn) hn.textContent = c.d + ' / ' + c.n;
  var g = goalState(c), gn = document.getElementById('goal');
  if (gn && g) { gn.className = 'goal' + (g.done ? ' done' : ''); gn.innerHTML = goalInner(g); }
  var hg = document.getElementById('herogoal');
  if (hg && g) hg.textContent = g.done ? '🎉 목표 달성! ' + (g.reward || '') : '🎯 ' + (g.reward ? g.reward + '까지 ' : '목표까지 ') + (g.target - g.count) + '일 남았어요';
}

/* ---------- 학급 목표 ---------- */
function goalState(c){
  var st = S.st; if (!st || !st.goal) return null;
  var p = st.goal.split('|'), start = p[1].slice(0, 4) + '-' + p[1].slice(4, 6) + '-' + p[1].slice(6, 8);
  c = c || counts();
  var count = (st.goalPast || 0) + (st.today >= start && c.n && c.d === c.n ? 1 : 0), target = +p[0];
  return { target: target, count: Math.min(count, target), raw: count, reward: p.slice(2).join('|'), done: count >= target, start: start };
}
function goalInner(g){ return g.done ? '🎉 목표 달성!<span class="gtx">' + esc(g.reward) + '</span>' : '🎯 <b>' + g.count + '</b> / ' + g.target + '일<span class="gtx">' + esc(g.reward) + '</span>'; }
function goalHtml(){ var g = goalState(); return g ? '<div class="goal' + (g.done ? ' done' : '') + '" id="goal" title="학급 목표: 모두 다 한 날">' + goalInner(g) + '</div>' : ''; }

/* ---------- 수업 시간 잠금 ---------- */
var DEFAULT_PERIODS = [['09:00','09:40'],['09:50','10:30'],['10:40','11:20'],['11:30','12:10'],['13:00','13:40'],['13:50','14:30']];
function parseLock(v){
  v = v || ''; var on = v.charAt(0) === '1', list = [], body = v.split('|')[1] || '';
  if (body) body.split(',').forEach(function(x){ list.push([x.slice(0, 2) + ':' + x.slice(2, 4), x.slice(5, 7) + ':' + x.slice(7, 9)]); });
  return { on: on, list: v ? list : DEFAULT_PERIODS.map(function(x){ return x.slice(); }) };
}
function lockString(on, list){
  return (on ? '1' : '0') + '|' + list.map(function(x){ return x[0].replace(':', '') + '-' + x[1].replace(':', ''); }).join(',');
}
function lockNow(){
  var st = S.st; if (!st || !st.lock || st.lock.charAt(0) !== '1' || st.rest) return null;
  if (S.unlockUntil && Date.now() < S.unlockUntil) return null;
  var d = new Date(), m = d.getHours() * 60 + d.getMinutes(), list = parseLock(st.lock).list;
  for (var i = 0; i < list.length; i++) {
    var a = list[i][0].split(':'), b = list[i][1].split(':'), s0 = +a[0] * 60 + +a[1], e0 = +b[0] * 60 + +b[1];
    if (m >= s0 && m < e0) {
      var end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +b[0], +b[1]).getTime();
      return { end: (+b[0] < 12 ? '오전 ' : '오후 ') + ((+b[0] % 12) || 12) + ':' + b[1], endMs: end };
    }
  }
  return null;
}

/* ---------- 칭찬 음성 ---------- */
function koVoice(){
  try { var v = window.speechSynthesis.getVoices(); for (var i = 0; i < v.length; i++) if (/^ko/i.test(v[i].lang)) return v[i]; } catch(e){}
  return null;
}
function speak(text, force, queue){
  if (!force && !(S.st && S.st.voice)) return;
  var ss = window.speechSynthesis; if (!ss || !window.SpeechSynthesisUtterance) return;
  try {
    if (!queue) ss.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR';
    var v = koVoice(); if (v) u.voice = v;
    u.rate = 1.05; u.pitch = 1.25; ss.speak(u);
  } catch(e){}
}
/* 김하늘 → 하늘아, 이바다 → 바다야 */
function callName(name){
  var n = String(name || '').replace(/^\s+|\s+$/g, '');
  if (/^[가-힣]{3}$/.test(n)) n = n.slice(1);
  var c = n.charCodeAt(n.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return n + ((c - 0xAC00) % 28 ? '아' : '야');
  return n;
}

var LOW_PART = 0.62;
function isLow(){ return !!(S.st && S.st.align === 'low'); }
function fit(){
  var g = document.getElementById('grid'); if (!g) return;
  var n = S.st.students.length, W = g.clientWidth - 20, floor = Math.min(13, W / 2 / 12.9);
  // 높이 H 안에 다 들어가는 가장 큰 글자 크기를 찾는다.
  var pick = function(H){
    var fs = floor;
    for (var cols = 1; cols <= 12; cols++) {
      fs = Math.min(34, W / cols / 12.9);
      if (Math.ceil(n / cols) * fs * 10.1 <= H) return { fs: fs, ok: fs >= floor };
    }
    return { fs: fs, ok: false };
  };
  var board = g.parentNode, hero = document.getElementById('hero');
  if (!isLow()) { g.style.fontSize = Math.max(floor, pick(window.innerHeight - g.offsetTop - 22).fs) + 'px'; return; }
  // 아래쪽(저학년): 먼저 화면 아래 부분에만 넣어 보고, 안 되면 위로 넓히고, 그래도 안 되면 보통 화면처럼 스크롤한다.
  var top = board.querySelector('.top'), full = window.innerHeight - (top ? top.offsetHeight : 100) - 22;
  var low = pick(Math.min(window.innerHeight * LOW_PART, full + 22) - 22), r = low;
  if (!low.ok) r = pick(full);
  board.className = r.ok ? 'board low' : 'board';
  if (hero) { hero.style.display = low.ok ? '' : 'none'; hero.className = 'hero'; }
  g.style.fontSize = Math.max(floor, r.fs) + 'px';
  if (hero && low.ok && hero.scrollHeight > hero.clientHeight + 2) {
    hero.className = 'hero tight';
    if (hero.scrollHeight > hero.clientHeight + 2) hero.style.visibility = 'hidden';
    else hero.style.visibility = '';
  } else if (hero) hero.style.visibility = '';
}

/* 명단을 한꺼번에 붙여 넣기: 한 줄에 한 명. "이름 역할", "번호 이름 역할 횟수", 엑셀에서 복사한 칸도 된다. */
function parseBulk(text){
  var out = [], lines = String(text).split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].replace(/^\s+|\s+$/g, ''), parts, no = '';
    if (!t) continue;
    if (t.indexOf('\t') >= 0) parts = t.split('\t');
    else if (t.indexOf(',') >= 0) parts = t.split(',');
    else {
      var m = t.match(/^(\d+)[.)\s]+(.+)$/);
      if (m) { no = m[1]; t = m[2]; }
      var sp = t.search(/\s/);
      parts = sp < 0 ? [t] : [t.slice(0, sp), t.slice(sp + 1)];
      var c = (parts[1] || '').match(/^(.*\S)\s+([1-5])\s*(번|회)?$/);
      if (c) { parts[1] = c[1]; parts[2] = c[2]; }
    }
    for (var k = 0; k < parts.length; k++) parts[k] = parts[k].replace(/^\s+|\s+$/g, '');
    if (!no && parts.length > 1 && /^\d+$/.test(parts[0])) no = parts.shift();
    if (!parts[0] || parts[0] === '이름') continue;
    out.push({ no: no, name: parts[0].slice(0, 12), role: (parts[1] || '').slice(0, 20), icon: '', target: Math.max(1, Math.min(5, parseInt(parts[2], 10) || 1)) });
  }
  return out;
}

function saveLock(){
  var L = S.lockEdit, re = /^\d{2}:\d{2}$/, list = [];
  for (var i = 0; i < L.list.length; i++) {
    var x = L.list[i];
    if (!re.test(x[0]) || !re.test(x[1])) { toast((i + 1) + '교시 시간을 확인해 주세요.'); return; }
    if (x[0] >= x[1]) { toast((i + 1) + '교시: 끝나는 시각이 시작보다 늦어야 해요.'); return; }
    list.push([x[0], x[1]]);
  }
  list.sort(function(a, b){ return a[0] < b[0] ? -1 : 1; });
  if (list.length > 12) { toast('교시는 12개까지 넣을 수 있어요.'); return; }
  if (L.on && !list.length) { toast('잠글 교시를 하나 이상 넣어 주세요.'); return; }
  adminCall('updateClass', [{ lock: lockString(L.on, list) }], function(r){
    S.admin.lock = r.lock; S.st.lock = r.lock; S.lockEdit = parseLock(r.lock); S.unlockUntil = 0; render();
    toast(S.lockEdit.on ? '수업 시간 잠금을 켰어요.' : '수업 시간 잠금을 껐어요.');
  });
}
function adminCall(fn, extra, ok){ api(fn, [S.code, S.pw].concat(extra), ok); }

function render(){
  if (S.lastView !== S.view) { var ot = document.querySelector('.toast'); if (ot) ot.parentNode.removeChild(ot); S.lastView = S.view; }
  if (S.view === 'board') renderBoard();
  else if (S.view === 'stickers') renderStickers();
  else if (S.view === 'settings') renderSettings();
}
