<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2a28; --paper:#f6ecd2; --white:#fffdf6;
  --red:#d8362b; --orange:#f39a2b; --yellow:#f7cf3d; --green:#5fae57; --blue:#4a90c9; --pink:#ef8fa8;
  --cut:14px 22px 16px 24px / 22px 14px 24px 16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(rgba(120,90,40,.13) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.hand{font-family:'Gaegu','Jua',sans-serif;font-weight:700}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* 종이 버튼 */
.btn{
  font-size:20px;padding:10px 18px;background:var(--white);border:2.5px solid var(--ink);
  border-radius:var(--cut);box-shadow:3px 4px 0 rgba(43,42,40,.22);white-space:nowrap;
}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(43,42,40,.22)}
.btn.yellow{background:var(--yellow)} .btn.red{background:var(--red);color:#fff} .btn.green{background:#bfe3b4}
.btn.small{font-size:16px;padding:6px 12px}
.btn.plain{border-color:transparent;box-shadow:none;background:none;text-decoration:underline}

/* 머리 부분 */
.top{display:flex;align-items:center;padding:14px 20px 6px}
.cal{
  width:92px;flex:none;text-align:center;background:var(--white);border:2.5px solid var(--ink);
  border-radius:8px 10px 12px 9px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(-3deg);overflow:hidden;
}
.cal .m{background:var(--red);color:#fff;font-size:17px;padding:2px 0}
.cal .d{font-size:40px;line-height:1.05}
.cal .w{font-size:15px;padding-bottom:3px}
.cal.sun .d,.cal.sun .w{color:var(--red)}
.title{margin:0 0 0 22px;font-weight:400;font-size:38px;line-height:1.15;word-break:keep-all}
.title em{font-style:normal;padding:0 6px;background:linear-gradient(transparent 52%,var(--yellow) 52%,var(--yellow) 92%,transparent 92%)}
.grow{flex:1}
.clock{margin-left:26px;font-size:36px;line-height:1;white-space:nowrap;padding:8px 14px 6px;background:var(--white);
  border:2.5px solid var(--ink);border-radius:20px 16px 22px 15px / 16px 22px 15px 20px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(1.5deg)}
.clock small{font-size:.5em;margin-right:6px}
.clock i{font-style:normal;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.prog{display:flex;align-items:center;margin-right:16px}
.prog .lab{font-size:17px;margin-right:8px}
.bar{width:210px;height:26px;border:2.5px solid var(--ink);border-radius:13px 15px 12px 14px;background:var(--white);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-right:2.5px solid var(--ink);transition:width .5s;
  background:repeating-linear-gradient(-55deg,var(--green) 0,var(--green) 7px,#7cc373 7px,#7cc373 11px)}
.bar i.zero{border-right:0}
.prog .num{font-size:26px;margin-left:10px;min-width:74px;white-space:nowrap}
.top .btn{margin-left:10px}
.net{font-size:15px;padding:3px 10px;border-radius:12px;background:var(--ink);color:#fff;margin-right:8px;display:none}
.net.show{display:inline-block}
.net.bad{background:var(--red)}

/* 이름표 */
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:8px 10px 14px;font-size:22px}
/* 아래쪽(저학년): 이름표를 화면 아래 부분에 모으고, 위에는 큰 안내를 둔다 */
.board.low{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.board.low .grid{flex:none;margin-top:auto;align-content:flex-end;padding-bottom:10px}
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px;overflow:hidden}
.hero .big{font-size:clamp(28px,5.2vw,86px);line-height:1.1}
.hero .big b{font-weight:400;color:var(--red)}
.hero .sub{font-size:clamp(17px,2vw,32px);margin-top:.35em}
/* 배경 사진이 있을 때 글씨가 잘 보이도록 종이 띠를 깐다 */
body.hasimg .top{background:rgba(246,236,210,.9);box-shadow:0 2px 0 rgba(43,42,40,.12);padding-bottom:12px}
body.hasimg .hero .big,body.hasimg .hero .sub,body.hasimg .center h2,body.hasimg .center p{background:rgba(255,253,246,.88);padding:.08em .5em;border-radius:14px}
body.hasimg .hero .arrow{text-shadow:0 0 6px #fff,0 0 12px #fff}
.swatches{display:flex;flex-wrap:wrap;margin-bottom:8px}
.where{display:flex;align-items:flex-start;padding:8px 10px;margin-top:6px;border:2px solid #d8cfb6;border-radius:10px;cursor:pointer;font-size:18px;line-height:1.3}
.where input{width:22px;height:22px;margin:2px 10px 0 0;flex:none}
.where.on{border-color:var(--ink);background:#fff6cf}
.where small{font-size:16px}
.gload{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#eaf2fb;border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:17px}
.gload .btn{margin-top:4px}
.privacy-note{font:14px/1.5 sans-serif;margin:8px 0 0;color:#44546a}
.privacy-note a{color:#2b5c9a}
/* 수업 시간 잠금 */
.lockov{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;
  background:rgba(246,236,210,.72)}
.lockbox{pointer-events:auto;text-align:center;background:var(--white);border:3px solid var(--ink);border-radius:var(--cut);padding:20px 30px;
  box-shadow:6px 8px 0 rgba(43,42,40,.25);transform:rotate(-1.5deg);max-width:90%}
.lockbox .lk1{font-size:clamp(26px,3.6vw,54px)}
.lockbox .lk2{font-size:clamp(17px,1.8vw,28px);margin:6px 0 14px}
/* 학급 목표 */
.goal{margin-left:14px;font-size:22px;white-space:nowrap;padding:6px 12px 4px;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:16px 12px 18px 12px;box-shadow:3px 4px 0 rgba(43,42,40,.22);transform:rotate(-1.5deg)}
.goal b{font-weight:400;color:var(--red)}
.goal .gtx{font-size:.75em;margin-left:4px}
.goal.done{background:#ffd0dc;animation:pop .5s}
/* 백업 알림 점 */
.btn.due{position:relative}
.btn.due:after{content:'';position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.warnbox{background:#fdeeee;border:2px solid #e7a6a1;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:18px}
.warnbox .btn{margin-top:8px}
.row .pn{width:64px;font-size:18px}.row .w-time{width:190px}
.card{-webkit-touch-callout:none}
.sw{width:86px;height:64px;margin:0 10px 10px 0;border:2.5px solid var(--ink);border-radius:12px;cursor:pointer;position:relative;
  font-size:15px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;box-shadow:2px 3px 0 rgba(43,42,40,.18)}
.sw span{background:rgba(255,253,246,.9);border-radius:6px;padding:0 5px}
.sw.on{outline:4px solid var(--red);outline-offset:2px}
.sw.img{background-size:cover;background-position:center}
.hero .arrow{font-size:clamp(22px,3vw,48px);margin-top:.2em;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.25em)}}
@media (max-height:560px){.hero .sub,.hero .arrow{display:none}}
.hero.tight .sub,.hero.tight .arrow{display:none}
.card{
  position:relative;width:12em;height:9.2em;margin:.45em;padding:.6em .7em;
  border:.12em solid var(--ink);border-radius:var(--cut);box-shadow:.2em .26em 0 rgba(43,42,40,.2);cursor:pointer;
}
.card:before{
  content:'';position:absolute;top:-.55em;left:50%;width:3.4em;height:1.05em;margin-left:-1.7em;
  background:rgba(255,246,190,.82);border-left:1px dashed rgba(43,42,40,.25);border-right:1px dashed rgba(43,42,40,.25);
  transform:rotate(-2deg);
}
.c0{background:#ffd6cb}.c1{background:#ffe4b8}.c2{background:#fff0a3}.c3{background:#d3edc4}.c4{background:#cbe4f6}.c5{background:#f9cfde}
.card:active{transform:scale(.97) !important}
.no{
  position:absolute;top:.5em;left:.55em;width:1.75em;height:1.75em;line-height:1.7em;text-align:center;font-size:.95em;
  background:var(--white);border:.12em solid var(--ink);border-radius:50%;
}
.name{margin-left:1.25em;font-size:1.9em;line-height:1.12;white-space:nowrap;overflow:hidden}
.name.long{font-size:1.45em;line-height:1.46}
.role{margin-top:.1em;font-size:1.12em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role i{font-style:normal;margin-right:.2em}
.slots{position:absolute;left:0;right:0;bottom:.5em;display:flex;justify-content:center;align-items:center}
.slot{
  position:relative;width:3.7em;height:3.7em;margin:0 .12em;border:.12em dashed rgba(43,42,40,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.slot b{font-weight:400;font-size:1.1em;color:rgba(43,42,40,.3)}
.t2 .slot{width:3.6em;height:3.6em}.t3 .slot{width:3.2em;height:3.2em}
.t4 .slot{width:2.5em;height:2.5em}.t5 .slot{width:2em;height:2em}
.t4 .slot b,.t5 .slot b{font-size:.8em}
.slot.on{border-color:transparent}
.stamp{position:absolute;left:-6%;top:-6%;width:112%;height:112%;color:var(--red);opacity:.9}
.stamp.new{animation:ink .28s .2s backwards}
@keyframes ink{0%{transform:scale(1.3);opacity:0}100%{opacity:.9}}
.presser{position:fixed;z-index:55;pointer-events:none;transform-origin:50% 100%;animation:press .62s forwards}
.presser svg{display:block;width:100%;height:100%}
@keyframes press{
  0%{transform:translateY(-80%) rotate(-16deg);opacity:0;animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  14%{opacity:1}
  32%{transform:translateY(0) rotate(0) scaleY(1)}
  41%{transform:translateY(0) rotate(0) scaleY(.88)}
  54%{transform:translateY(0) rotate(0) scaleY(1);opacity:1}
  100%{transform:translateY(-75%) rotate(10deg);opacity:0}
}
.card.hit{animation:hit .3s}
@keyframes hit{35%{margin-top:.8em;margin-bottom:.1em}70%{margin-top:.3em;margin-bottom:.6em}}
.undo{
  position:absolute;right:.4em;top:.4em;font-size:.72em;padding:.2em .55em;background:var(--white);
  border:.14em solid var(--ink);border-radius:1em;display:none;
}
.card.some .undo{display:block}
.streak{position:absolute;left:-.5em;top:-.75em;font-size:.72em;padding:.1em .45em;background:var(--yellow);
  border:.14em solid var(--ink);border-radius:.4em;transform:rotate(-5deg);z-index:2}
.card.absent{background:#e6e0d0;border-style:dashed;box-shadow:none;opacity:.75}
.card.absent .slots{font-size:1.5em;color:rgba(43,42,40,.55)}
.card.shake{animation:shake .35s}
@keyframes shake{25%{margin-left:.2em}50%{margin-left:.7em}75%{margin-left:.3em}}

/* 가운데 안내 */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}
.center h2{font-weight:400;font-size:54px;margin:0 0 8px}
.center p{font-size:28px;margin:6px 0 22px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;max-width:900px;margin-bottom:18px}
.tags .btn{font-size:30px;padding:16px 30px;margin:10px}
.banner{
  position:fixed;left:50%;top:38%;z-index:60;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;
  font-size:64px;padding:18px 44px;background:var(--yellow);border:5px solid var(--ink);border-radius:var(--cut);
  box-shadow:8px 10px 0 rgba(43,42,40,.25);white-space:nowrap;animation:pop .5s cubic-bezier(.2,1.6,.5,1);
}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;font-size:20px;padding:10px 22px;
  background:var(--ink);color:#fff;border-radius:12px;max-width:90%}

/* 스티커판 */
.wrap{max-width:1100px;margin:0 auto;padding:6px 20px 30px}
table.st{width:100%;border-collapse:collapse;background:var(--white);border:2.5px solid var(--ink);font-size:22px}
table.st th{font-weight:400;background:#cbe4f6;border-bottom:2.5px solid var(--ink);padding:8px 4px}
table.st th.rest{color:var(--red)}
table.st th,table.st td{white-space:nowrap}
table.st td{padding:5px 4px;text-align:center;border-bottom:1.5px dashed rgba(43,42,40,.3)}
table.st td.nm{text-align:left;padding-left:14px;white-space:nowrap}
table.st td.nm small{font-family:'Gaegu',sans-serif;font-size:.8em;margin-left:8px;opacity:.75}
.dot{display:inline-block;width:38px;height:38px;line-height:34px;border-radius:50%;font-size:22px;border:2px dashed rgba(43,42,40,.25);color:rgba(43,42,40,.45)}
.dot.full{border:2.5px solid var(--ink);color:#fff;transform:rotate(-8deg)}
.dot.part{border:2.5px solid var(--ink);background:var(--white);color:var(--ink)}
.dot.future,.dot.rest{border-color:transparent}
.dot.absent{border-color:transparent;font-size:15px}
.legend{font-size:17px;margin:10px 2px}
.legend .dot{width:26px;height:26px;line-height:22px;font-size:15px;vertical-align:middle;margin:0 4px 0 14px}

/* 설정 */
.tabs{display:flex;flex-wrap:wrap;margin:0 0 14px}
.tabs .btn{margin:0 8px 8px 0}
.tabs .btn.on{background:var(--ink);color:#fff}
.sheet{background:var(--white);border:2.5px solid var(--ink);border-radius:var(--cut);padding:18px;box-shadow:4px 5px 0 rgba(43,42,40,.18)}
.sheet h3{font-weight:400;font-size:24px;margin:0 0 4px}
.sheet h3:not(:first-child){margin-top:20px}
.sheet p.note{font-family:'Gaegu',sans-serif;font-size:19px;margin:2px 0 12px;line-height:1.35}
.in{font-size:20px;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff;min-width:0;-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;margin-bottom:8px}
.row>*{margin-right:8px}
.row .w-no{width:66px;text-align:center}.row .w-name{width:150px}.row .w-role{flex:1}.row .w-date{width:190px}
.row .ico{width:52px;height:46px;font-size:24px;padding:0;background:#fff;border:2px solid var(--ink);border-radius:8px}
.row .cnt{width:74px}
.rowhead{font-size:16px;opacity:.7}
.field{margin-bottom:16px}
.field label{display:block;font-size:18px;margin-bottom:4px}
.field .in{width:100%}
.field .line{display:flex}.field .line .in{flex:1;margin-right:8px}
.chips{display:flex;flex-wrap:wrap}
.chips .btn{margin:0 8px 8px 0}
.chips .btn.on{background:#e6e0d0;border-style:dashed;text-decoration:line-through}
.url{font-family:monospace;font-size:15px;word-break:break-all;background:#f3eedd;padding:8px;border-radius:6px;-webkit-user-select:all;user-select:all}

/* 모달 */
.shade{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(43,42,40,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border:3px solid var(--ink);border-radius:var(--cut);padding:22px;width:460px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:6px 8px 0 rgba(43,42,40,.3)}
.modal h3{font-weight:400;font-size:26px;margin:0 0 12px}
.modal .btns{display:flex;justify-content:flex-end;margin-top:14px}
.modal .btns .btn{margin-left:8px}
.emo{display:flex;flex-wrap:wrap}
.emo button{width:54px;height:54px;font-size:28px;border:0;background:none}

@media (max-width:1100px){
  .title{font-size:30px;margin-left:16px}.clock{font-size:28px;margin-left:16px}
  .prog .lab{display:none}.bar{width:130px}.prog .num{font-size:22px;min-width:62px}
}
@media (max-width:900px){
  .top{flex-wrap:wrap;padding:10px 12px 2px}
  .cal{width:70px}.cal .m{font-size:14px}.cal .d{font-size:30px}.cal .w{font-size:12px}
  .title{font-size:25px;margin-left:14px}
  .clock{font-size:23px;margin-left:12px;padding:6px 10px 4px}
  .prog{order:9;width:100%;margin:12px 0 0}.prog .lab{display:inline}.bar{flex:1;width:auto}
  .btn{font-size:17px;padding:8px 12px}.btn.small{font-size:15px;padding:6px 10px}
  .center h2{font-size:34px}.center p{font-size:21px}
  .tags .btn{font-size:22px;padding:12px 20px;margin:7px}
  .banner{font-size:34px;padding:12px 24px}
  .wrap{padding:6px 10px 24px;overflow-x:auto}
  table.st{font-size:17px}table.st td.nm small{display:none}
  .dot{width:28px;height:28px;line-height:24px;font-size:16px}.dot.absent{font-size:11px}
  .row{flex-wrap:wrap}.row .w-role{flex:1 1 100%;order:5;margin-top:6px}.rowhead{display:none}
  .row .w-date{width:150px}
  .sheet{padding:14px}.field .line{flex-wrap:wrap}.field .line .in{flex:1 1 100%;margin:0 0 8px}
}
@media (max-width:900px){.goal .gtx{display:none}.goal{font-size:18px;margin-left:10px}}
@media (max-width:520px){
  .cal{width:56px;border-width:2px}.cal .m{font-size:12px}.cal .d{font-size:24px}.cal .w{font-size:11px}
  .title{font-size:20px;margin-left:10px;flex:1 1 calc(100% - 80px);min-width:0}
  .fslab{display:none}
  .clock{margin-top:10px !important;margin-right:8px !important}
  .goal{font-size:15px;padding:4px 8px 2px;margin:10px 6px 0 0}
  .top .btn{font-size:15px;padding:5px 9px;margin-right:6px}
  .clock{font-size:17px !important;padding:5px 8px 3px !important}
  .title em{display:inline-block}
  .grow{display:none}
  .clock{font-size:19px;margin:0}
  .top .btn{margin:10px 8px 0 0}
  .prog{margin-top:10px}
  .banner{font-size:25px;white-space:normal;width:86%;text-align:center}
  .center h2{font-size:28px}.center p{font-size:19px}
  table.st{font-size:15px}table.st td.nm{padding-left:8px}
  .row .w-name{flex:1;width:auto}
  .emo button{width:46px;height:46px;font-size:24px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><path id="arcTop" d="M 19 52 A 31 31 0 0 1 81 52"/></defs></svg>
<div id="app"></div>

<script>
(function(){
'use strict';

var S = { view:'load', code:'', st:null, classes:[], q:[], busy:false, pw:'', admin:null, tab:'roster', edit:[], rest:[], force:false };
var app = document.getElementById('app');
var WEEK = ['일','월','화','수','목','금','토'];
var COLORS = ['#d8362b','#f39a2b','#f7cf3d','#5fae57','#4a90c9','#ef8fa8'];
var EMOJI = ['🧽','✏️','📚','📋','🥛','🍚','🥄','🌱','🌻','💧','🚪','💡','🪟','🗑️','♻️','✨','👟','☂️','🎒','🪑','⏰','🔔','📢','🎵','🎨','⚽','🏃','🧴','🩹','📮','📏','🖍️','🐟','🐹','❤️','⭐'];

function tone(freq, t0, dur, type, vol, slideTo){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || .25, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}

var cv = document.getElementById('fx'), cx = cv.getContext('2d'), parts = [], raf = 0;
function sizeFx(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
function burst(x, y, n, rain){
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    parts.push({
      x: rain ? Math.random() * cv.width : x, y: rain ? -20 - Math.random() * cv.height * .6 : y,
      vx: rain ? (Math.random() - .5) * 3 : Math.cos(a) * v, vy: rain ? 2 + Math.random() * 4 : Math.sin(a) * v - 5,
      w: 8 + Math.random() * 10, h: 5 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: COLORS[i % COLORS.length], life: rain ? 260 : 70 + Math.random() * 30
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  var keep = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    p.vy += .32; p.vx *= .985; if (p.vy > 7) p.vy = 7;
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    if (p.life <= 0 || p.y > cv.height + 30) continue;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1, p.life / 20); cx.fillStyle = p.c;
    cx.fillRect(-p.w / 2, -p.h / 2 * Math.cos(p.r * 2), p.w, p.h * Math.cos(p.r * 2));
    cx.restore(); keep.push(p);
  }
  parts = keep;
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

function bgGet(){ var k = S.code; return k ? (store('bg_' + k) || '') : ''; }

function applyBg(force){

/* 사진을 화면 크기에 맞게 줄이고 JPEG 로 바꿔 저장한다. (브라우저 저장 공간이 작으므로) */
function bgLoadFile(file){
  if (!file || !/^image\//.test(file.type)) { toast('사진 파일을 골라 주세요.'); return; }
  toast('사진을 맞추는 중이에요…');
  var url = (window.URL || window.webkitURL).createObjectURL(file), im = new Image();
  im.onload = function(){
    var max = 1600, w = im.naturalWidth, h = im.naturalHeight, r = Math.min(1, max / Math.max(w, h));
    var cv = document.createElement('canvas'); cv.width = Math.round(w * r); cv.height = Math.round(h * r);
    var c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(im, 0, 0, cv.width, cv.height);
    (window.URL || window.webkitURL).revokeObjectURL(url);
    // 브라우저 저장 공간(약 5MB)은 기록과 함께 쓰므로 사진 한 장은 450KB 아래로 맞춘다.
    var data = '', q = [0.8, 0.7, 0.6, 0.5, 0.4, 0.3];
    for (var i = 0; i < q.length; i++) { data = cv.toDataURL('image/jpeg', q[i]); if (data.length < 450000) break; }
    try {
      localStorage.setItem('bgimg_' + S.code, data);
      localStorage.setItem('bg_' + S.code, 'img');
    } catch (e) {
      toast('사진이 너무 커서 저장하지 못했어요. 더 작은 사진을 골라 주세요.'); return;
    }
    applyBg(true); render(); toast('배경 사진을 바꿨어요.');
  };
  im.onerror = function(){ toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); };
  im.src = url;
}

var DEFAULT_PERIODS = [['09:00','09:40'],['09:50','10:30'],['10:40','11:20'],['11:30','12:10'],['13:00','13:40'],['13:50','14:30']];
function parseLock(v){
  v = v || ''; var on = v.charAt(0) === '1', list = [], body = v.split('|')[1] || '';
  if (body) body.split(',').forEach(function(x){ list.push([x.slice(0, 2) + ':' + x.slice(2, 4), x.slice(5, 7) + ':' + x.slice(7, 9)]); });
  return { on: on, list: v ? list : DEFAULT_PERIODS.map(function(x){ return x.slice(); }) };
}
function lockString(on, list){
  return (on ? '1' : '0') + '|' + list.map(function(x){ return x[0].replace(':', '') + '-' + x[1].replace(':', ''); }).join(',');
}
function lockNow(){
  var st = S.st; if (!st || !st.lock || st.lock.charAt(0) !== '1' || st.rest) return null;
  if (S.unlockUntil && Date.now() < S.unlockUntil) return null;
  var d = new Date(), m = d.getHours() * 60 + d.getMinutes(), list = parseLock(st.lock).list;
  for (var i = 0; i < list.length; i++) {
    var a = list[i][0].split(':'), b = list[i][1].split(':'), s0 = +a[0] * 60 + +a[1], e0 = +b[0] * 60 + +b[1];
    if (m >= s0 && m < e0) {

      return { end: (+b[0] < 12 ? '오전 ' : '오후 ') + ((+b[0] % 12) || 12) + ':' + b[1], endMs: end };

}

function koVoice(){

  return null;

/* 김하늘 → 하늘아, 이바다 → 바다야 */
function callName(name){
  var n = String(name || '').replace(/^\s+|\s+$/g, '');

  var c = n.charCodeAt(n.length - 1);

  return n;
}

var LOW_PART = 0.62;
function isLow(){ return !!(S.st && S.st.align === 'low'); }
function fit(){
  var g = document.getElementById('grid'); if (!g) return;
  var n = S.st.students.length, W = g.clientWidth - 20, floor = Math.min(13, W / 2 / 12.9);
  // 높이 H 안에 다 들어가는 가장 큰 글자 크기를 찾는다.
  var pick = function(H){
    var fs = floor;
    for (var cols = 1; cols <= 12; cols++) {
      fs = Math.min(34, W / cols / 12.9);
      if (Math.ceil(n / cols) * fs * 10.1 <= H) return { fs: fs, ok: fs >= floor };
    }
    return { fs: fs, ok: false };
  };
  var board = g.parentNode, hero = document.getElementById('hero');
  if (!isLow()) { g.style.fontSize = Math.max(floor, pick(window.innerHeight - g.offsetTop - 22).fs) + 'px'; return; }
  // 아래쪽(저학년): 먼저 화면 아래 부분에만 넣어 보고, 안 되면 위로 넓히고, 그래도 안 되면 보통 화면처럼 스크롤한다.
  var top = board.querySelector('.top'), full = window.innerHeight - (top ? top.offsetHeight : 100) - 22;
  var low = pick(Math.min(window.innerHeight * LOW_PART, full + 22) - 22), r = low;
  if (!low.ok) r = pick(full);

  if (hero) { hero.style.display = low.ok ? '' : 'none'; hero.className = 'hero'; }
  g.style.fontSize = Math.max(floor, r.fs) + 'px';
  if (hero && low.ok && hero.scrollHeight > hero.clientHeight + 2) {
    hero.className = 'hero tight';

    else hero.style.visibility = '';
  } else if (hero) hero.style.visibility = '';
}

      var w = s.week[k];
      if (st.week[k].date === st.today) w = s.absent ? 'absent' : full ? 'full' : s.done > 0 ? 'part' : (st.rest ? 'rest' : 'none');
      var inner = w === 'full' ? '★' : w === 'part' ? '·' : w === 'absent' ? '결석' : '';
      h += '<td><span class="dot ' + w + '"' + (w === 'full' ? ' style="background:' + COLORS[(i + k) % 6] + '"' : '') + '>' + inner + '</span></td>';
    }
    var add = (full ? 1 : 0) - (s.base ? 1 : 0);
    var sk = streakNow(s);
    h += '<td>' + (sk >= 2 ? sk + '일' : '') + '</td><td>' + (s.monthFull + add) + '<small style="opacity:.6"> / ' + Math.max(s.monthDays, s.monthFull + add) + '일</small></td><td>' + (s.total + add) + '개</td></tr>';
  }
  h += '</table><p class="legend hand"><span class="dot full" style="background:#f39a2b">★</span>다 했어요<span class="dot part">·</span>조금 했어요<span class="dot none"></span>아직</p></div>';
  app.innerHTML = h;
}

/* 명단을 한꺼번에 붙여 넣기: 한 줄에 한 명. "이름 역할", "번호 이름 역할 횟수", 엑셀에서 복사한 칸도 된다. */
function parseBulk(text){
  var out = [], lines = String(text).split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].replace(/^\s+|\s+$/g, ''), parts, no = '';
    if (!t) continue;
    if (t.indexOf('\t') >= 0) parts = t.split('\t');
    else if (t.indexOf(',') >= 0) parts = t.split(',');
    else {
      var m = t.match(/^(\d+)[.)\s]+(.+)$/);
      if (m) { no = m[1]; t = m[2]; }
      var sp = t.search(/\s/);
      parts = sp < 0 ? [t] : [t.slice(0, sp), t.slice(sp + 1)];
      var c = (parts[1] || '').match(/^(.*\S)\s+([1-5])\s*(번|회)?$/);
      if (c) { parts[1] = c[1]; parts[2] = c[2]; }
    }
    for (var k = 0; k < parts.length; k++) parts[k] = parts[k].replace(/^\s+|\s+$/g, '');
    if (!no && parts.length > 1 && /^\d+$/.test(parts[0])) no = parts.shift();
    if (!parts[0] || parts[0] === '이름') continue;
    out.push({ no: no, name: parts[0].slice(0, 12), role: (parts[1] || '').slice(0, 20), icon: '', target: Math.max(1, Math.min(5, parseInt(parts[2], 10) || 1)) });
  }
  return out;
}

    '<textarea class="in" id="bulk" rows="9" style="width:100%;font-size:18px;line-height:1.5" placeholder="김하늘 칠판 지우기&#10;이바다 우유 나르기&#10;박구름 화분 물 주기"></textarea>' +

    '<button class="btn yellow" data-act="bulkset">' + (first ? '넣기' : '전부 바꾸기') + '</button></div>');
  var m = document.querySelector('#shade .modal'); if (m) m.style.width = '560px';

function applyBulk(replace){
  var list = parseBulk(val('bulk'));
  if (!list.length) { toast('이름을 한 줄에 한 명씩 적어 주세요.'); return; }
  var base = replace ? [] : S.edit.filter(function(e){ return e.name; }), used = {}, next = 1, i;
  for (i = 0; i < base.length; i++) used[base[i].no] = true;
  for (i = 0; i < list.length; i++) {
    if (!list[i].no || used[list[i].no]) { while (used[String(next)]) next++; list[i].no = String(next); }
    used[list[i].no] = true; base.push(list[i]);
  }
  S.edit = base; closeModal(); render();
  toast(list.length + '명을 넣었어요. 확인하고 [저장하기]를 눌러 주세요.');
}

      (BOOT.url ? '<h3>우리 반 바로가기 주소</h3><p class="note">전자칠판 즐겨찾기에 이 주소를 넣어 두면 바로 우리 반이 열려요.</p><div class="url">' + esc(BOOT.url + '?' + (BOOT.web && !isLocal() ? 'g&' : '') + 'c=' + S.code) + '</div><br>' : '') +
      '<div class="row"><button class="btn" data-act="pick">다른 학급으로 가기</button><span class="grow"></span><button class="btn red small" data-act="delclass">이 학급 지우기</button></div>';
  }
  app.innerHTML = h + '</div></div>';
}
function saveLock(){
  var L = S.lockEdit, re = /^\d{2}:\d{2}$/, list = [];
  for (var i = 0; i < L.list.length; i++) {
    var x = L.list[i];
    if (!re.test(x[0]) || !re.test(x[1])) { toast((i + 1) + '교시 시간을 확인해 주세요.'); return; }
    if (x[0] >= x[1]) { toast((i + 1) + '교시: 끝나는 시각이 시작보다 늦어야 해요.'); return; }
    list.push([x[0], x[1]]);
  }
  list.sort(function(a, b){ return a[0] < b[0] ? -1 : 1; });
  if (list.length > 12) { toast('교시는 12개까지 넣을 수 있어요.'); return; }
  if (L.on && !list.length) { toast('잠글 교시를 하나 이상 넣어 주세요.'); return; }
  adminCall('updateClass', [{ lock: lockString(L.on, list) }], function(r){
    S.admin.lock = r.lock; S.st.lock = r.lock; S.lockEdit = parseLock(r.lock); S.unlockUntil = 0; render();
    toast(S.lockEdit.on ? '수업 시간 잠금을 켰어요.' : '수업 시간 잠금을 껐어요.');
  });
}
function adminCall(fn, extra, ok){ api(fn, [S.code, S.pw].concat(extra), ok); }

/* ---------- 그리기 ---------- */
function render(){
  if (S.view === 'board') renderBoard();
  else if (S.view === 'stickers') renderStickers();
  else if (S.view === 'settings') renderSettings();
}

/* ---------- 누르기 ---------- */
function act(a, el){
  var i = +el.getAttribute('data-i');
  switch (a) {
    case 'reload': showPick(); break;
    case 'open': openClass(el.getAttribute('data-code')); break;
    case 'newclass': newClassModal(); break;
    case 'close': closeModal(); break;
    case 'createclass':
      var wh = document.querySelector('input[name=nc-where]:checked');
      if (wh && canGoogle()) {
        window.ONE_ROLE.useMode(wh.value);
        if (wh.value === 'google') window.ONE_ROLE.login();
      }
      el.disabled = true;
      var npw = val('nc-pw'), nlow = !!(document.getElementById('nc-low') || {}).checked;
      api('createClass', [val('nc-name'), val('nc-url'), npw], function(r){
        // 만든 김에 바로 명단 넣는 화면으로 간다.
        closeModal(); S.code = r.code; S.force = false; store('c', r.code);
        app.innerHTML = '<div class="center"><h2>학급을 만들었어요!</h2></div>';
        var go = function(){ enterSettings(npw, function(){ bulkModal(true); }); };
        if (nlow) api('updateClass', [r.code, npw, { align: 'low' }], go, go); else go();
      }, function(m){ el.disabled = false; toast(m); });
      break;
    case 'gload':
      closeModal(); store('c', null); S.pw = '';
      window.ONE_ROLE.useMode('google'); window.ONE_ROLE.login();
      showPick();
      break;
    case 'gotolocal':
      store('c', null); S.pw = ''; window.ONE_ROLE.useMode('local'); showPick();
      break;
    case 'bulk': bulkModal(false); break;
    case 'bulkadd': applyBulk(false); break;
    case 'bulkset': applyBulk(true); break;
    case 'stamp': stamp(i); break;
    case 'fs': fsToggle(); break;
    case 'undo': undo(i); break;
    case 'force': S.force = true; render(); break;
    case 'stickers': S.view = 'stickers'; render(); break;
    case 'board': S.view = 'board'; S.pw = ''; S.admin = null; render(); break;
    case 'settings': askPw(); break;
    case 'login': login(); break;
    case 'tab': S.tab = el.getAttribute('data-tab'); render(); break;
    case 'addrow':
      var mx = 0; for (var k = 0; k < S.edit.length; k++) mx = Math.max(mx, parseInt(S.edit[k].no, 10) || 0);
      S.edit.push({ no: String(mx + 1), name: '', role: '', icon: '', target: 1 }); render();
      var ins = app.querySelectorAll('input[data-f="name"]'); if (ins.length) ins[ins.length - 1].focus();
      break;
    case 'delrow': S.edit.splice(i, 1); render(); break;
    case 'cnt': S.edit[i].target = S.edit[i].target % 5 + 1; render(); break;
    case 'emoji':
      var h = '<h3>그림 고르기</h3><div class="emo">';
      for (var e = 0; e < EMOJI.length; e++) h += '<button data-act="pickemoji" data-i="' + i + '" data-e="' + EMOJI[e] + '">' + EMOJI[e] + '</button>';
      modal(h + '</div><div class="btns"><button class="btn" data-act="pickemoji" data-i="' + i + '" data-e="">자동으로</button><button class="btn" data-act="close">닫기</button></div>');
      break;
    case 'pickemoji': S.edit[i].icon = el.getAttribute('data-e'); closeModal(); render(); break;
    case 'saveroster':
      adminCall('saveRoster', [S.edit], function(st){ setState(st); S.edit = rosterOf(st); render(); toast('저장했어요. [칠판으로]를 누르면 이름표가 보여요.'); });
      break;
    case 'absent':
      var s = S.st.students[i];
      adminCall('setAbsent', [s.no, !s.absent, S.st.today], function(r){
        if (r && r.stale) { toast('날짜가 바뀌었어요. 새로 불러옵니다.'); refresh(); return; }
        if (r.state) setState(r.state); else { s.absent = r.absent; s.done = r.done; }
        render();
      });
      break;
    case 'addrest': S.rest.push({ start: S.st.today, end: S.st.today, name: '' }); render(); break;
    case 'delrest': S.rest.splice(i, 1); render(); break;
    case 'saverest': adminCall('saveRest', [S.rest], function(st){ setState(st); render(); toast('저장했어요.'); }); break;
    case 'newsheet':
      modal('<h3>' + (isLocal() ? '새 기록장으로 시작할까요?' : '새 스프레드시트를 만들까요?') + '</h3><p class="hand" style="font-size:19px">' + (isLocal() ? '새 기록장을 만들어 0부터 다시 기록해요. 명단과 쉬는 날은 따라가요. 지난 기록은 먼저 [기록 내려받기]로 받아 두세요.' : '새 파일을 만들어 그쪽에 기록해요. 명단과 쉬는 날은 따라가고, 지금 시트와 지난 기록은 그대로 남아요.') + '</p>' +
        '<div class="btns"><button class="btn" data-act="close">취소</button><button class="btn yellow" data-act="newsheet2">만들기</button></div>');
      break;
    case 'newsheet2':
      el.disabled = true;
      adminCall('updateClass', [{ newSheet: true }], function(r){
        closeModal(); toast(isLocal() ? '새 기록장으로 바꿨어요.' : '새 스프레드시트를 만들었어요. [열어 보기]로 확인해 보세요.');
        api('auth', [S.code, S.pw], function(ad){ S.admin = ad; setState(ad.state); S.edit = JSON.parse(JSON.stringify(ad.roster)); S.rest = JSON.parse(JSON.stringify(ad.rest)); render(); });
      });
      break;
    case 'savesheet':
      if (!val('s-url')) { toast('새 주소를 붙여 넣어 주세요.'); break; }
      adminCall('updateClass', [{ sheetUrl: val('s-url') }], function(r){
        S.admin.sheetUrl = r.sheetUrl; toast(r.copied ? '시트를 바꾸고 명단을 옮겼어요.' : '시트를 바꿨어요.');
        api('auth', [S.code, S.pw], function(ad){ S.admin = ad; setState(ad.state); S.edit = JSON.parse(JSON.stringify(ad.roster)); S.rest = JSON.parse(JSON.stringify(ad.rest)); render(); });
      });
      break;
    case 'savename': adminCall('updateClass', [{ name: val('s-name') }], function(r){ S.admin.name = r.name; S.st.name = r.name; render(); toast('이름을 바꿨어요.'); }); break;
    case 'savepw':
      var np = val('s-pw');
      adminCall('updateClass', [{ newPw: np }], function(){ S.pw = np; S.tpw = null; render(); toast('비밀번호를 바꿨어요.'); });
      break;
    case 'tpwok': teacherAuthOk(); break;
    case 'tunlock':
      var lk0 = lockNow();
      teacherAuth(function(){ var l2 = lockNow() || lk0; S.unlockUntil = l2 ? l2.endMs : 0; render(); toast('이번 수업 시간이 끝날 때까지 풀었어요.'); });
      break;
    case 'tundo': closeModal(); undo(i); break;
    case 'tabsent':
      var ts = S.st.students[i];
      api('setAbsent', [S.code, S.tpw, ts.no, !ts.absent, S.st.today], function(r){
        closeModal();
        if (r && r.stale) { toast('날짜가 바뀌었어요. 새로 불러옵니다.'); refresh(); return; }
        if (r.state) setState(r.state); render(); toast(r.absent ? ts.name + ' 결석으로 표시했어요.' : ts.name + ' 결석을 풀었어요.');
      });
      break;
    case 'lockon': S.lockEdit.on = el.getAttribute('data-v') === '1'; saveLock(); break;
    case 'lockadd':
      var lst = S.lockEdit.list, last = lst.length ? lst[lst.length - 1][1] : '09:00';
      S.lockEdit.list.push([last, last]); render(); break;
    case 'lockdel': S.lockEdit.list.splice(i, 1); render(); break;
    case 'lockdefault': S.lockEdit.list = DEFAULT_PERIODS.map(function(x){ return x.slice(); }); render(); break;
    case 'locksave': saveLock(); break;
    case 'ue':
      adminCall('updateClass', [{ ue: el.getAttribute('data-v') === '1' }], function(r){ S.admin.ue = r.ue; S.st.ue = r.ue; render(); toast(r.ue ? '학생도 [지우기]를 쓸 수 있어요.' : '지우기는 선생님만 할 수 있어요. 이름표를 길게 누르세요.'); });
      break;
    case 'goalsave': case 'goalreset':
      var gn2 = parseInt(val('g-n'), 10), gt = val('g-t').replace(/\|/g, ' ').replace(/^\s+|\s+$/g, '').slice(0, 30), og = goalState();
      if (!(gn2 >= 1 && gn2 <= 999)) { toast('목표 일수를 1~999 사이로 적어 주세요.'); break; }
      var start = a === 'goalsave' && og ? og.start : S.st.today;
      adminCall('updateClass', [{ goal: gn2 + '|' + start.replace(/-/g, '') + '|' + gt }], function(r){
        S.admin.goal = r.goal; api('getState', [S.code], function(st){ setState(st); render(); toast(a === 'goalreset' ? '오늘부터 다시 세요.' : '학급 목표를 저장했어요.'); });
      });
      break;
    case 'goaloff':
      adminCall('updateClass', [{ goal: '' }], function(r){ S.admin.goal = ''; S.st.goal = ''; render(); toast('학급 목표를 껐어요.'); });
      break;
    case 'voice':
      adminCall('updateClass', [{ voice: el.getAttribute('data-v') === '1' }], function(r){ S.admin.voice = r.voice; S.st.voice = r.voice; render(); if (r.voice) speak('칭찬 음성을 켰어요!', true); });
      break;
    case 'voicetest':
      var vs = S.st.students[0];
      speak(vs ? callName(vs.name) + ', 고마워! ' + (vs.role ? vs.role + ' 완료!' : '') : '하늘아, 고마워! 칠판 지우기 완료!', true);
      if (!window.speechSynthesis) toast('이 브라우저는 음성을 지원하지 않아요.');
      break;
    case 'bg':
      store('bg_' + S.code, el.getAttribute('data-v') || null); applyBg(true); render();
      break;
    case 'bgpick':
      var bf = document.getElementById('bg-file');
      bf.value = ''; bf.onchange = function(){ bgLoadFile(bf.files && bf.files[0]); };
      bf.click();
      break;
    case 'bgdel':
      store('bgimg_' + S.code, null); if (bgGet() === 'img') store('bg_' + S.code, null);
      applyBg(true); render(); toast('사진을 지웠어요.');
      break;
    case 'align':
      adminCall('updateClass', [{ align: el.getAttribute('data-v') }], function(r){ S.admin.align = r.align; S.st.align = r.align; render(); toast(r.align === 'low' ? '이름표를 아래쪽에 모았어요. [칠판으로]를 눌러 확인해 보세요.' : '이름표를 화면 전체에 펼쳤어요.'); });
      break;
    case 'sound': adminCall('updateClass', [{ sound: !S.admin.sound }], function(r){ S.admin.sound = r.sound; S.st.sound = r.sound; render(); }); break;
    case 'pick': store('c', null); S.pw = ''; showPick(); break;
    case 'dl':
      var sn = el.getAttribute('data-sheet');
      window.ONE_ROLE.download('1인1역_' + S.st.name + '_' + sn + '_' + S.st.today + '.csv', window.ONE_ROLE.csv(S.code, sn), 'text/csv;charset=utf-8');
      break;
    case 'backup': store('or_lastbackup', String(Date.now())); setTimeout(render, 50); window.ONE_ROLE.download('1인1역_백업_' + S.st.today + '.json', window.ONE_ROLE.backup(), 'application/json'); toast('백업 파일을 저장했어요.'); break;
    case 'restore':
      var fi = document.getElementById('restore-file');
      fi.onchange = function(){
        var f = fi.files && fi.files[0]; if (!f) return;
        var rd = new FileReader();
        rd.onload = function(){
          try { var n = window.ONE_ROLE.restore(String(rd.result)); toast(n + '개 학급을 불러왔어요.'); store('c', null); S.pw = ''; showPick(); }
          catch (e) { toast(e.message || '백업 파일을 읽지 못했어요.'); }
        };
        rd.readAsText(f);
      };
      fi.click();
      break;
    case 'mode':
      modal('<h3>저장 방식을 바꿀까요?</h3><p class="hand" style="font-size:19px">지금까지의 기록은 그대로 남지만, 다른 저장 방식으로 옮겨지지는 않아요. 바꾼 뒤에는 학급을 새로 만들어야 해요.</p>' +
        '<div class="btns"><button class="btn" data-act="close">취소</button><button class="btn yellow" data-act="mode2">바꾸기</button></div>');
      break;
    case 'mode2': window.ONE_ROLE.changeMode(); break;
    case 'logout': store('c', null); S.pw = ''; S.admin = null; window.ONE_ROLE.logout(); showPick(); break;
    case 'delclass':
      modal('<h3>이 학급을 지울까요?</h3><p class="hand" style="font-size:19px">' + (isLocal() ?
        '이 기기에서 학급과 <b>모든 도장 기록</b>이 지워지고 되돌릴 수 없어요. 필요하면 먼저 [백업 파일 저장]이나 [기록 내려받기]를 해 두세요.' :
        '학급 목록에서만 사라지고, 스프레드시트와 기록은 그대로 남아요.') + '</p>' +
        '<div class="btns"><button class="btn" data-act="close">취소</button><button class="btn red" data-act="delclass2">지우기</button></div>');
      break;
    case 'delclass2': store('bg_' + S.code, null); store('bgimg_' + S.code, null); adminCall('deleteClass', [], function(){ closeModal(); store('c', null); S.pw = ''; showPick(); }); break;
  }
}
function rosterOf(st){
  var out = [];
  for (var i = 0; i < st.students.length; i++) { var s = st.students[i]; out.push({ no: s.no, name: s.name, role: s.role, icon: s.icon, target: s.target }); }
  return out;
}

document.addEventListener('click', function(ev){
  // 길게 누른 뒤 손을 뗄 때 생기는 click 은 버린다. (도장이 더 찍히거나 방금 뜬 창이 닫히지 않게)
  if (S.suppressUntil) {
    var late = Date.now() > S.suppressUntil; S.suppressUntil = 0;
    if (!late && !(ev.target.closest && ev.target.closest('.modal'))) return;
  }
  var t = ev.target;
  if (t.id === 'shade') { closeModal(); return; }
  while (t && t !== document) {
    var a = t.getAttribute && t.getAttribute('data-act');
    if (a) { act(a, t); return; }
    t = t.parentNode;
  }
});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t && t.name === 'nc-where') { var ls = document.querySelectorAll('.where'); for (var i = 0; i < ls.length; i++) ls[i].className = 'where' + (ls[i].querySelector('input').checked ? ' on' : ''); }
});
document.addEventListener('input', function(ev){
  var t = ev.target, i = +t.getAttribute('data-i'), f = t.getAttribute('data-f'), g = t.getAttribute('data-g');
  if (f && S.edit[i]) S.edit[i][f] = t.value;
  if (g && S.rest[i]) S.rest[i][g] = t.value;
  var l = t.getAttribute('data-l');
  if (l !== null && S.lockEdit && S.lockEdit.list[i]) S.lockEdit.list[i][+l] = t.value;
});
document.addEventListener('keydown', function(ev){
  if (ev.keyCode !== 13) return;
  if (ev.target.id === 'pw') login();
  if (ev.target.id === 'tpw') teacherAuthOk();
});
window.addEventListener('resize', function(){
  sizeFx(); fit();
  var ov = document.getElementById('lockov'), tb = document.querySelector('.top');
  if (ov && tb) ov.style.top = tb.getBoundingClientRect().bottom + 'px';
});
window.addEventListener('storage', function(e){
  if (e.key && (e.key.indexOf('or_book_') === 0 || e.key === 'or_classes')) refresh();
});

// 날짜가 바뀌면 바로, 그 밖에는 10분마다 새로 불러온다.
setInterval(function(){
  if (S.view !== 'board' && S.view !== 'stickers') return;
  if (!S.st) return;
  if (S.day !== localDay() || Date.now() - S.loaded > 10 * 60 * 1000) refresh();
}, 30000);

sizeFx();
var start = BOOT.c || store('c');
if (start) openClass(start); else showPick();
})();
</script>
</body>
